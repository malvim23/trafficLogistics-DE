<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficLogistics DE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeml3PjKrK9mWXKjKCtsdyTlj8ZLfHic8",
  authDomain: "trafficlogistics-de.firebaseapp.com",
  projectId: "trafficlogistics-de",
  storageBucket: "trafficlogistics-de.firebasestorage.app",
  messagingSenderId: "236059665812",
  appId: "1:236059665812:web:c926097f6a7ed252a85b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const STATUS_OPTIONS = ['','OK','Falta','Formação','Back Up','Backup Externo','Backup Interno'];
const ALL_FIELDS = ['Entregues','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados','Entregas DHL','Saldo','Tentativas','Devoluções'];

let currentUser = null;
let state = {
  page: 'dashboard', month: new Date().getMonth(), year: new Date().getFullYear(),
  selectedClient: null, dashboardClient: 'all', presencaClient: 'all',
  clients: [], motoristas: [], presencas: {}, entregas: {}, loaded: false,
  repStartDate: '', repEndDate: ''
};
let unsubListeners = [];

// ── AUDIT LOG ──────────────────────────────────────────
async function logAction(action, details) {
  try {
    await addDoc(collection(db, 'audit_log'), {
      user: currentUser?.email || 'unknown',
      action, details,
      ts: new Date().toISOString()
    });
  } catch(e) { console.error('log error', e); }
}

// ── FIREBASE HELPERS ───────────────────────────────────
async function fbSet(path, data) { try { await setDoc(doc(db, path), data, {merge:true}); } catch(e){console.error(e);} }
async function fbGet(path) { try { const d=await getDoc(doc(db,path)); return d.exists()?d.data():null; } catch(e){return null;} }
function fbListen(path, cb) { return onSnapshot(doc(db,path), s=>{ if(s.exists()) cb(s.data()); }); }

async function loadAllData() {
  const cfg = await fbGet('config/main');
  if(cfg) {
    state.clients = cfg.clients||[];
    state.motoristas = cfg.motoristas||[];
    if(state.clients.length && !state.selectedClient) state.selectedClient = state.clients[0].id;
  } else {
    state.clients = [
      {id:1,name:'Telheiras',location:'Lisboa',fields:['Entregues','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados']},
      {id:2,name:'Vila Real',location:'Vila Real',fields:['Entregas DHL','Entregues','Saldo']}
    ];
    state.motoristas = [
      {id:1,name:'Rodrigo',client:1,contact:'',active:true,entryDate:'',exitDate:''},
      {id:2,name:'João Silva',client:1,contact:'',active:true,entryDate:'',exitDate:''},
      {id:3,name:'Carlos Mendes',client:2,contact:'',active:true,entryDate:'',exitDate:''}
    ];
    await saveConfig();
  }
  // Ensure motoristas have new fields
  state.motoristas = state.motoristas.map(m=>({active:true,entryDate:'',exitDate:'',...m}));
  await loadMonthData();
  state.loaded = true;
  showPage(state.page);
  setupListeners();
}

function monthKey() { return `${state.year}-${String(state.month+1).padStart(2,'0')}`; }

async function loadMonthData() {
  const mk=monthKey();
  const p=await fbGet(`presencas/${mk}`); if(p) state.presencas={...state.presencas,...p};
  const e=await fbGet(`entregas/${mk}`); if(e) state.entregas={...state.entregas,...e};
}

function setupListeners() {
  unsubListeners.forEach(u=>u()); unsubListeners=[];
  const mk=monthKey();
  unsubListeners.push(
    fbListen(`presencas/${mk}`, d=>{state.presencas={...state.presencas,...d}; if(state.page==='presencas')renderPresencas(); if(state.page==='dashboard')renderDashboard();}),
    fbListen(`entregas/${mk}`, d=>{state.entregas={...state.entregas,...d}; if(state.page==='entregas')renderEntregas(); if(state.page==='dashboard')renderDashboard();}),
    fbListen('config/main', d=>{
      if(d.clients) state.clients=d.clients;
      if(d.motoristas) state.motoristas=d.motoristas.map(m=>({active:true,entryDate:'',exitDate:'',...m}));
      if(['clientes','motoristas','dashboard'].includes(state.page)) showPage(state.page);
    })
  );
}

async function saveConfig() { await fbSet('config/main',{clients:state.clients,motoristas:state.motoristas}); }
async function savePresencas() { await fbSet(`presencas/${monthKey()}`,state.presencas); }
async function saveEntregas() { await fbSet(`entregas/${monthKey()}`,state.entregas); }

// ── HELPERS ────────────────────────────────────────────
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getDow(y,m,d){return new Date(y,m,d).getDay();}
function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}
function encodeF(f){return f.replace(/[^a-zA-Z0-9]/g,'_');}
function getPresence(y,m,d,mid){return state.presencas[`${y}-${m}-${d}-${mid}`]||'';}
function setPresence(y,m,d,mid,v){state.presencas[`${y}-${m}-${d}-${mid}`]=v; savePresencas();}
function getEntrega(cid,y,m,d,f){return Number(state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`])||0;}
function setEntrega(cid,y,m,d,f,v){state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`]=Number(v)||0; saveEntregas();}
function edrClass(v){if(v===null||v===undefined)return '';return v>=95?'edr-high':v>=80?'edr-mid':'edr-low';}
function statusClass(v){
  if(v==='OK')return 'status-ok'; if(v==='Falta')return 'status-falta';
  if(v==='Formação')return 'status-formacao'; if(v==='Back Up')return 'status-backup';
  if(v==='Backup Externo')return 'status-bext'; if(v==='Backup Interno')return 'status-bint';
  return 'status-empty';
}
function fmtDate(iso){if(!iso)return '—'; const d=new Date(iso); return d.toLocaleDateString('pt-PT');}
function changeMonth(d){
  state.month+=d;
  if(state.month<0){state.month=11;state.year--;} if(state.month>11){state.month=0;state.year++;}
  loadMonthData().then(()=>{setupListeners();showPage(state.page);});
}
function monthNav(){
  return `<div class="month-nav">
    <button onclick="window._cm(-1)">◀</button>
    <span>${MONTHS[state.month]} ${state.year}</span>
    <button onclick="window._cm(1)">▶</button>
  </div>`;
}

// ── ROUTER ─────────────────────────────────────────────
window._showPage = function(page){
  state.page=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick')?.includes(`'${page}'`)));
  const titles={dashboard:'Dashboard',presencas:'Presenças',entregas:'Entregas Diárias',clientes:'Clientes',motoristas:'Motoristas',relatorios:'Relatórios',historico:'Histórico de Edições'};
  document.getElementById('page-title').textContent=titles[page]||page;
  if(!state.loaded){document.getElementById('content').innerHTML='<div style="padding:40px;text-align:center;color:#666">A carregar...</div>';return;}
  ({dashboard:renderDashboard,presencas:renderPresencas,entregas:renderEntregas,clientes:renderClientes,motoristas:renderMotoristas,relatorios:renderRelatorios,historico:renderHistorico})[page]?.();
};
function showPage(p){window._showPage(p);}
window._cm = changeMonth;

// ── DASHBOARD ──────────────────────────────────────────
function renderDashboard(){
  const y=state.year,m=state.month,days=daysInMonth(y,m),today=new Date().getDate();
  const filterCid=state.dashboardClient==='all'?null:Number(state.dashboardClient);
  const clients=filterCid?state.clients.filter(c=>c.id===filterCid):state.clients;
  let totalEnt=0,totalNao=0;
  clients.forEach(c=>{for(let d=1;d<=days;d++){totalEnt+=getEntrega(c.id,y,m,d,c.fields[0]);if(c.fields[1])totalNao+=getEntrega(c.id,y,m,d,c.fields[1]);}});
  const totalG=totalEnt+totalNao,edrG=totalG>0?Math.round((totalEnt/totalG)*100):0;
  const motsFilt=filterCid?state.motoristas.filter(mo=>mo.client===filterCid&&mo.active!==false):state.motoristas.filter(mo=>mo.active!==false);
  let faltasHoje=0; motsFilt.forEach(mo=>{if(getPresence(y,m,today,mo.id)==='Falta')faltasHoje++;});

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <select onchange="window._dashFilter(this.value)" style="padding:6px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px">
      <option value="all" ${state.dashboardClient==='all'?'selected':''}>Todos os clientes</option>
      ${state.clients.map(c=>`<option value="${c.id}" ${state.dashboardClient==c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>`;

  document.getElementById('content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">Total Entregues</div><div class="value">${totalEnt.toLocaleString()}</div></div>
      <div class="stat-card red"><div class="label">Não Entregues</div><div class="value">${totalNao.toLocaleString()}</div></div>
      <div class="stat-card green"><div class="label">EDR Geral</div><div class="value">${edrG}%</div></div>
      <div class="stat-card orange"><div class="label">Faltas Hoje</div><div class="value">${faltasHoje}</div></div>
      <div class="stat-card blue"><div class="label">Clientes</div><div class="value">${clients.length}</div></div>
      <div class="stat-card"><div class="label">Motoristas Ativos</div><div class="value">${motsFilt.length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Resumo por Cliente — ${MONTHS[m]} ${y}</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Cliente</th><th>Entregues</th><th>Não Entregues</th><th>Total</th><th>EDR%</th><th>Motoristas</th></tr></thead>
        <tbody>${clients.map(c=>{
          let ent=0,nao=0;
          for(let d=1;d<=days;d++){ent+=getEntrega(c.id,y,m,d,c.fields[0]);if(c.fields[1])nao+=getEntrega(c.id,y,m,d,c.fields[1]);}
          const tot=ent+nao,edr=tot>0?Math.round((ent/tot)*100):null;
          const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false).map(mo=>mo.name).join(', ');
          return `<tr><td><strong>${c.name}</strong><br><small style="color:#5f6368">${c.location}</small></td>
            <td>${ent.toLocaleString()}</td><td>${nao.toLocaleString()}</td><td>${tot.toLocaleString()}</td>
            <td class="edr-cell ${edrClass(edr)}">${edr!==null?edr+'%':'—'}</td><td>${mots||'—'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Atalhos Rápidos</span></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="window._showPage('presencas')">✅ Registar Presença</button>
        <button class="btn btn-primary" onclick="window._showPage('entregas')">📦 Lançar Entregas</button>
        <button class="btn btn-outline" onclick="window._showPage('relatorios')">📄 Ver Relatórios</button>
        <button class="btn btn-outline" onclick="window._showPage('historico')">🕓 Histórico</button>
      </div>
    </div>`;
}
window._dashFilter=v=>{state.dashboardClient=v;renderDashboard();};

// ── PRESENÇAS ──────────────────────────────────────────
function renderPresencas(){
  const y=state.year,m=state.month,days=daysInMonth(y,m);
  const filterCid=state.presencaClient==='all'?null:Number(state.presencaClient);
  const mots=filterCid?state.motoristas.filter(mo=>mo.client===filterCid&&mo.active!==false):state.motoristas.filter(mo=>mo.active!==false);

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <select onchange="window._presFilter(this.value)" style="padding:6px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px">
      <option value="all" ${state.presencaClient==='all'?'selected':''}>Todos</option>
      ${state.clients.map(c=>`<option value="${c.id}" ${state.presencaClient==c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>
    <button class="btn btn-outline btn-sm" onclick="window._exportPresExcel()">⬇ Excel</button>
    <button class="btn btn-outline btn-sm" onclick="window._exportPresPDF()">🖨️ PDF</button>`;

  if(!mots.length){document.getElementById('content').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#666">Nenhum motorista ativo para este cliente.</div>';return;}

  let html=`<div class="card">
    <div class="card-header">
      <span class="card-title">Presenças — ${MONTHS[m]} ${y}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px">
        <span class="leg-ok">✅ OK</span><span class="leg-falta">❌ Falta</span>
        <span class="leg-form">📘 Formação</span><span class="leg-back">🔄 Back Up</span>
        <span class="leg-bext">🟣 B.Externo</span><span class="leg-bint">🟠 B.Interno</span>
      </div>
    </div>
    <div class="presence-grid"><table class="presence-table">
      <thead><tr><th>Dia Sem.</th><th>Dia</th>
        ${mots.map(mo=>{const c=state.clients.find(x=>x.id===mo.client);return `<th>${mo.name}${c&&!filterCid?`<br><small style="font-weight:400;opacity:.7">${c.name}</small>`:''}</th>`;}).join('')}
      </tr></thead><tbody>`;

  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    html+=`<tr><td class="day-info${wk?' weekend':''}" style="font-size:11px">${DAYS_PT[dow]}</td>
      <td class="day-info${wk?' weekend':''}" style="font-weight:700">${d}</td>
      ${mots.map(mo=>{
        const val=getPresence(y,m,d,mo.id);
        return `<td class="${wk?'weekend':''} ${statusClass(val)}" id="pc-${d}-${mo.id}">
          <select class="status-select" onchange="window._updatePres(${y},${m},${d},${mo.id},this)">
            ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===val?'selected':''}>${s||'—'}</option>`).join('')}
          </select></td>`;
      }).join('')}
    </tr>`;
  }

  html+=`<tr style="background:#f0f4f8;font-weight:700"><td colspan="2" style="text-align:right;padding:8px 12px">Totais</td>
    ${mots.map(mo=>{
      let ok=0,falta=0,form=0,back=0,bext=0,bint=0;
      for(let d=1;d<=days;d++){const v=getPresence(y,m,d,mo.id);
        if(v==='OK')ok++;else if(v==='Falta')falta++;else if(v==='Formação')form++;
        else if(v==='Back Up')back++;else if(v==='Backup Externo')bext++;else if(v==='Backup Interno')bint++;}
      return `<td style="font-size:11px;text-align:center">${ok?`✅${ok} `:''}${falta?`❌${falta} `:''}${form?`📘${form} `:''}${back?`🔄${back} `:''}${bext?`🟣${bext} `:''}${bint?`🟠${bint}`:''}`;
    }).join('')}
  </tr></tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
}
window._presFilter=v=>{state.presencaClient=v;renderPresencas();};
window._updatePres=(y,m,d,mid,sel)=>{
  const old=getPresence(y,m,d,mid);
  setPresence(y,m,d,mid,sel.value);
  logAction('Presença alterada',`Motorista ID ${mid} | Dia ${d}/${m+1}/${y} | ${old||'—'} → ${sel.value||'—'}`);
  const cell=document.getElementById(`pc-${d}-${mid}`);
  if(cell) cell.className=cell.className.replace(/status-\S+/g,'').trim()+' '+statusClass(sel.value);
};

// ── ENTREGAS ───────────────────────────────────────────
function renderEntregas(){
  const y=state.year,m=state.month;
  if(!state.selectedClient||!state.clients.find(c=>c.id===state.selectedClient)) state.selectedClient=state.clients[0]?.id||null;
  const client=state.clients.find(c=>c.id===state.selectedClient);

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <button class="btn btn-outline btn-sm" onclick="window._exportEntExcel()">⬇ Excel</button>
    <button class="btn btn-outline btn-sm" onclick="window._exportEntPDF()">🖨️ PDF</button>`;

  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
    <span style="font-size:12px;font-weight:600;color:#5f6368">Cliente:</span>
    ${state.clients.map(c=>`<div class="pill ${c.id===state.selectedClient?'active':''}" onclick="window._selClient(${c.id})">${c.name}</div>`).join('')}
  </div>`;

  if(!client){document.getElementById('content').innerHTML=html+'<div class="card" style="padding:40px;text-align:center">Nenhum cliente.</div>';return;}

  const days=daysInMonth(y,m),fields=client.fields,totals={};
  fields.forEach(f=>totals[f]=0);

  html+=`<div class="card">
    <div class="card-header">
      <span class="card-title">${client.name} — ${MONTHS[m]} ${y}</span>
      <span style="font-size:12px;color:#5f6368">${state.motoristas.filter(mo=>mo.client===client.id&&mo.active!==false).map(m=>m.name).join(', ')}</span>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Dia Sem.</th><th>Dia</th>${fields.map(f=>`<th>${f}</th>`).join('')}<th>Total Dia</th><th>EDR%</th></tr></thead>
      <tbody>`;

  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6,bg=wk?'background:#fffde7':'';
    const vals={};fields.forEach(f=>{vals[f]=getEntrega(client.id,y,m,d,f);totals[f]+=vals[f];});
    const rowTotal=fields.reduce((s,f)=>s+vals[f],0);
    const edrVal=rowTotal>0?Math.round((vals[fields[0]]/rowTotal)*100):null;
    html+=`<tr style="${bg}">
      <td style="font-size:11px">${DAYS_PT[dow]}</td><td style="font-weight:700">${d}</td>
      ${fields.map(f=>`<td><input class="delivery-input" type="number" min="0" value="${vals[f]||''}" placeholder="0"
        onchange="window._updateEnt(${client.id},${y},${m},${d},'${encodeF(f)}','${f}',this.value,${d})" /></td>`).join('')}
      <td style="font-weight:600" id="total-${d}">${rowTotal||''}</td>
      <td class="edr-cell ${edrClass(edrVal)}" id="edr-${d}">${edrVal!==null?edrVal+'%':'—'}</td>
    </tr>`;
  }

  const grandTotal=fields.reduce((s,f)=>s+totals[f],0);
  const edrTotal=grandTotal>0?Math.round((totals[fields[0]]/grandTotal)*100):null;
  html+=`<tr style="background:#f0f4f8;font-weight:700">
    <td colspan="2">Total</td>
    ${fields.map(f=>`<td id="ctotal-${encodeF(f)}">${totals[f].toLocaleString()}</td>`).join('')}
    <td id="grand-total">${grandTotal.toLocaleString()}</td>
    <td class="edr-cell ${edrClass(edrTotal)}" id="edr-total">${edrTotal!==null?edrTotal+'%':'—'}</td>
  </tr></tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
}
window._selClient=id=>{state.selectedClient=id;renderEntregas();};
window._updateEnt=(cid,y,m,d,fKey,fLabel,val,day)=>{
  const old=getEntrega(cid,y,m,d,fLabel);
  setEntrega(cid,y,m,d,fLabel,val);
  const client=state.clients.find(c=>c.id===cid);
  logAction('Entrega editada',`Cliente: ${client?.name} | Campo: ${fLabel} | Dia ${d}/${m+1}/${y} | ${old} → ${val}`);
  if(!client)return;
  const rowTotal=client.fields.reduce((s,f)=>s+getEntrega(cid,y,m,d,f),0);
  const edrVal=rowTotal>0?Math.round((getEntrega(cid,y,m,d,client.fields[0])/rowTotal)*100):null;
  const tc=document.getElementById(`total-${day}`);if(tc)tc.textContent=rowTotal||'';
  const ec=document.getElementById(`edr-${day}`);if(ec){ec.textContent=edrVal!==null?edrVal+'%':'—';ec.className=`edr-cell ${edrClass(edrVal)}`;}
  let grandTotal=0;
  client.fields.forEach(f=>{
    let s=0;for(let dd=1;dd<=daysInMonth(y,m);dd++)s+=getEntrega(cid,y,m,dd,f);
    const el=document.getElementById(`ctotal-${encodeF(f)}`);if(el)el.textContent=s.toLocaleString();
    grandTotal+=s;
  });
  const gt=document.getElementById('grand-total');if(gt)gt.textContent=grandTotal.toLocaleString();
  const etot=grandTotal>0?Math.round((colTotal(cid,y,m,client.fields[0])/grandTotal)*100):null;
  const et=document.getElementById('edr-total');if(et){et.textContent=etot!==null?etot+'%':'—';et.className=`edr-cell ${edrClass(etot)}`;}
};
function colTotal(cid,y,m,field){let s=0;for(let d=1;d<=daysInMonth(y,m);d++)s+=getEntrega(cid,y,m,d,field);return s;}

// ── CLIENTES ───────────────────────────────────────────
function renderClientes(){
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="window._openClientModal()">+ Novo Cliente</button>`;
  document.getElementById('content').innerHTML=`<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Cliente</th><th>Localização</th><th>Campos</th><th>Motoristas Ativos</th><th>Ações</th></tr></thead>
    <tbody>${state.clients.map(c=>{

// Build list of {year,month,day} between two date strings
function dateRange(startStr,endStr){
  const start=new Date(startStr),end=new Date(endStr),result=[];
  const cur=new Date(start);
  while(cur<=end){result.push({y:cur.getFullYear(),m:cur.getMonth(),d:cur.getDate()});cur.setDate(cur.getDate()+1);}
  return result;
}

async function ensureMonthLoaded(y,m){
  const mk=`${y}-${String(m+1).padStart(2,'0')}`;
  const p=await fbGet(`presencas/${mk}`);if(p) state.presencas={...state.presencas,...p};
  const e=await fbGet(`entregas/${mk}`);if(e) state.entregas={...state.entregas,...e};
}

window._exportExcelPeriod=async()=>{
  const type=document.getElementById('rep-type').value;
  const clientId=document.getElementById('rep-client').value;
  const startStr=document.getElementById('rep-start').value;
  const endStr=document.getElementById('rep-end').value;
  if(!startStr||!endStr)return alert('Selecione as datas');
  const days=dateRange(startStr,endStr);
  // Ensure all months loaded
  const months=[...new Set(days.map(x=>`${x.y}-${x.m}`))];
  for(const mk of months){const[y,m]=mk.split('-').map(Number);await ensureMonthLoaded(y,m);}
  const wb=XLSX.utils.book_new();
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  if(type==='presencas'){
    const mots=clientId==='all'?state.motoristas.filter(m=>m.active!==false):state.motoristas.filter(m=>m.client===Number(clientId)&&m.active!==false);
    const rows=[['Data','Dia Semana',...mots.map(m=>m.name)]];
    days.forEach(({y,m,d})=>{
      rows.push([`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)],...mots.map(mo=>getPresence(y,m,d,mo.id)||'')]);
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Presenças');
  } else {
    clients.forEach(c=>{
      const tots={};c.fields.forEach(f=>tots[f]=0);
      const rows=[['Data','Dia Semana',...c.fields,'Total Dia','EDR%']];
      days.forEach(({y,m,d})=>{
        const vals=c.fields.map(f=>{const v=getEntrega(c.id,y,m,d,f);tots[f]+=v;return v;});
        const rt=vals.reduce((a,b)=>a+b,0);
        rows.push([`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)],...vals,rt,rt>0?Math.round((vals[0]/rt)*100)+'%':'']);
      });
      const gt=c.fields.reduce((s,f)=>s+tots[f],0);
      rows.push(['TOTAL','',...c.fields.map(f=>tots[f]),gt,gt>0?Math.round((tots[c.fields[0]]/gt)*100)+'%':'']);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.name.substring(0,31));
    });
  }
  XLSX.writeFile(wb,`relatorio_${startStr}_${endStr}.xlsx`);
  logAction('Relatório Excel exportado',`Tipo: ${type} | Período: ${startStr} a ${endStr}`);
};

window._exportPDFPeriod=async()=>{
  const type=document.getElementById('rep-type').value;
  const clientId=document.getElementById('rep-client').value;
  const startStr=document.getElementById('rep-start').value;
  const endStr=document.getElementById('rep-end').value;
  if(!startStr||!endStr)return alert('Selecione as datas');
  const days=dateRange(startStr,endStr);
  const months=[...new Set(days.map(x=>`${x.y}-${x.m}`))];
  for(const mk of months){const[y,m]=mk.split('-').map(Number);await ensureMonthLoaded(y,m);}
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  let html=`<html><head><style>body{font-family:Arial;font-size:11px;padding:20px}h2{color:#1a73e8;margin-bottom:6px}h3{margin:16px 0 6px}p{color:#666;font-size:11px;margin-bottom:12px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#1e2a3a;color:#fff;padding:6px 8px}td{padding:5px 8px;border-bottom:1px solid #eee}tr:nth-child(even)td{background:#f9f9f9}.eh{color:#137333;font-weight:700}.el{color:#c5221f;font-weight:700}.tr td{background:#e8f0fe!important;font-weight:700}</style></head><body>

  if(type==='presencas'){
    const mots=clientId==='all'?state.motoristas.filter(m=>m.active!==false):state.motoristas.filter(m=>m.client===Number(clientId)&&m.active!==false);
    html+=`<table><thead><tr><th>Data</th><th>Semana</th>${mots.map(m=>`<th>${m.name}</th>`).join('')}</tr></thead><tbody>`;
    days.forEach(({y,m,d})=>{html+=`<tr><td>${d}/${m+1}/${y}</td><td>${DAYS_PT[getDow(y,m,d)]}</td>${mots.map(mo=>`<td>${getPresence(y,m,d,mo.id)||'—'}</td>`).join('')}</tr>`;});
    html+=`</tbody></table>`;
  } else {
    clients.forEach(c=>{
      const tots={};c.fields.forEach(f=>tots[f]=0);
      html+=`<h3>${c.name}</h3><table><thead><tr><th>Data</th>${c.fields.map(f=>`<th>${f}</th>`).join('')}<th>Total</th><th>EDR%</th></tr></thead><tbody>`;
      days.forEach(({y,m,d})=>{
        const vals=c.fields.map(f=>{const v=getEntrega(c.id,y,m,d,f);tots[f]+=v;return v;});
        const rt=vals.reduce((a,b)=>a+b,0);if(rt===0)return;
        const edr=Math.round((vals[0]/rt)*100);
        html+=`<tr><td>${d}/${m+1}/${y}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}<td>${rt}</td><td class="${edr>=95?'eh':edr<80?'el':''}">${edr}%</td></tr>`;
      });
      const gt=c.fields.reduce((s,f)=>s+tots[f],0),edrT=gt>0?Math.round((tots[c.fields[0]]/gt)*100):null;
      html+=`<tr class="tr"><td>TOTAL</td>${c.fields.map(f=>`<td>${tots[f]}</td>`).join('')}<td>${gt}</td><td>${edrT!==null?edrT+'%':'—'}</td></tr></tbody></table>`;
    });
  }
  html+=`</body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
  logAction('Relatório PDF exportado',`Tipo: ${type} | Período: ${startStr} a ${endStr}`);
};

      <div class="card-header"><span class="card-title">Histórico de Edições</span><span style="font-size:12px;color:#5f6368">Últimas ${logs.length} ações</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Data/Hora</th><th>Utilizador</th><th>Ação</th><th>Detalhes</th></tr></thead>
        <tbody>${logs.length?logs.map(l=>{
          const dt=new Date(l.ts);
          const dtStr=dt.toLocaleDateString('pt-PT')+' '+dt.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
          return `<tr><td style="white-space:nowrap">${dtStr}</td><td><strong>${l.user}</strong></td><td><span class="badge badge-ok" style="font-size:11px">${l.action}</span></td><td style="font-size:12px">${l.details}</td></tr>`;
        }).join(''):'<tr><td colspan="4" style="text-align:center;color:#666;padding:20px">Nenhuma ação registada ainda.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  } catch(e){
    document.getElementById('content').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#c5221f">Erro ao carregar histórico.</div>';
  }
}

// ── MODAL ──────────────────────────────────────────────
window._closeModal=()=>document.getElementById('modal-overlay').classList.add('hidden');

// ── AUTH ───────────────────────────────────────────────
function showLogin(){document.getElementById('app').classList.add('hidden');document.getElementById('login-screen').classList.remove('hidden');}
function showApp(){document.getElementById('login-screen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAllData();}

window._doLogin=async()=>{
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  document.getElementById('login-err').textContent='';
  try { await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ document.getElementById('login-err').textContent='Email ou password incorretos.'; }
};
window._doLogout=async()=>{await signOut(auth);};

onAuthStateChanged(auth,user=>{
  if(user){
    currentUser=user;
    document.getElementById('user-email').textContent=user.email;
    showApp();
  } else {
    currentUser=null;
    showLogin();
  }
});
</script>

<style>
  :root{--primary:#1a73e8;--primary-dark:#1557b0;--success:#34a853;--danger:#ea4335;--bg:#f0f4f8;--card:#fff;--text:#202124;--text-light:#5f6368;--border:#dadce0;}

  #sidebar .logo{padding:20px 16px;font-size:15px;font-weight:700;border-bottom:1px solid #2d3f54;display:flex;align-items:center;gap:8px;}

  #topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  #topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #content{flex:1;overflow-y:auto;padding:24px;}
  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;margin-bottom:20px;}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .card-title{font-size:15px;font-weight:600;}
  .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
  .btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}.btn-outline:hover{background:var(--bg);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .stat-card.blue .value{color:var(--primary);}.stat-card.green .value{color:var(--success);}
  .stat-card.red .value{color:var(--danger);}.stat-card.orange .value{color:#f57c00;}
  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:#f8f9fa;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 12px;border-bottom:1px solid #f0f0f0;}
  tr:hover td{background:#f8f9fa;}
  .badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;}
  .badge-ok{background:#e6f4ea;color:#137333;}.badge-falta{background:#fce8e6;color:#c5221f;}
  .presence-grid{overflow-x:auto;}

  .presence-table td.day-info{background:#f8f9fa;font-weight:600;}
  .presence-table td.weekend{background:#fffde7;}
  select.status-select{border:none;background:transparent;font-size:11px;width:105px;cursor:pointer;font-weight:600;}

  .status-falta{background:#fce8e6!important;color:#c5221f;}
  .status-formacao{background:#e8f0fe!important;color:#1a73e8;}
  .status-backup{background:#fef7e0!important;color:#b45309;}
  .status-bext{background:#f3e8ff!important;color:#7b2d8b;}
  .status-bint{background:#fff3e0!important;color:#e65100;}
  .status-empty{background:#f8f8f8!important;color:#999;}
  .leg-ok{background:#e6f4ea;color:#137333;padding:3px 8px;border-radius:10px;}

  .leg-back{background:#fef7e0;color:#b45309;padding:3px 8px;border-radius:10px;}
  .leg-bext{background:#f3e8ff;color:#7b2d8b;padding:3px 8px;border-radius:10px;}

  .delivery-input{width:60px;border:1px solid transparent;background:transparent;text-align:center;padding:2px;font-size:12px;border-radius:4px;}
  .delivery-input:focus{border-color:var(--primary);outline:none;background:#fff;}
  .edr-cell{font-weight:700;}
  .edr-high{color:#137333;}.edr-mid{color:#f57c00;}.edr-low{color:#c5221f;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;border-radius:16px;padding:28px;width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}

</head>
<body>

<div id="login-screen">
