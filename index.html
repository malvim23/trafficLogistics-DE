<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficLogistics DE</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeml3PjKrK9mWXKjKCtsdyTlj8ZLfHic8",
  authDomain: "trafficlogistics-de.firebaseapp.com",
  projectId: "trafficlogistics-de",
  storageBucket: "trafficlogistics-de.firebasestorage.app",
  messagingSenderId: "236059665812",
  appId: "1:236059665812:web:c926097f6a7ed252a85b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const STATUS_OPTIONS = ['','OK','Falta','Formação','Back Up','Backup Externo','Backup Interno','Folga'];
const ALL_FIELDS = ['Entregas','Entregues','Incidências','Não Visitados','Recolhas','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados','Saldo','Tentativas','Devoluções'];

// Fields that should NOT count toward EDR total (only "Entregues" is numerator, "Entregas" is base)
const EDR_EXCLUDE = ['Entregas']; // excluded from total sum, used as denominator base separately

let currentUser = null;
let state = {
  page:'dashboard', month:new Date().getMonth(), year:new Date().getFullYear(),
  selectedClient:null, dashboardClient:'all', presencaClients:[],
  clients:[], motoristas:[], presencas:{}, entregas:{}, rowColors:{}, loaded:false
};
let unsubListeners = [];

// ── AUDIT ──────────────────────────────────────────────
async function logAction(action, details) {
  try { await addDoc(collection(db,'audit_log'),{user:currentUser?.email||'unknown',action,details,ts:new Date().toISOString()}); } catch(e){}
}

// ── FIREBASE ───────────────────────────────────────────
async function fbSet(path,data){try{await setDoc(doc(db,path),data,{merge:true});}catch(e){console.error(e);}}
async function fbGet(path){try{const d=await getDoc(doc(db,path));return d.exists()?d.data():null;}catch(e){return null;}}
function fbListen(path,cb){return onSnapshot(doc(db,path),s=>{if(s.exists())cb(s.data());});}

async function loadAllData(){
  const cfg=await fbGet('config/main');
  if(cfg){
    state.clients=cfg.clients||[];
    state.motoristas=(cfg.motoristas||[]).map(m=>({active:true,entryDate:'',exitDate:'',...m}));
    if(state.clients.length&&!state.selectedClient) state.selectedClient=state.clients[0].id;
  } else {
    state.clients=[
      {id:1,name:'Telheiras',location:'Lisboa',color:'#e3f2fd',fields:['Entregas','Entregues','Incidências','Não Visitados','Recolhas','CA','CCU','Não entregues']},
      {id:2,name:'Vila Real',location:'Vila Real',color:'#f3e5f5',fields:['Entregas','Entregues','Saldo']}
    ];
    state.motoristas=[
      {id:1,name:'Rodrigo',client:1,contact:'',active:true,entryDate:'',exitDate:''},
      {id:2,name:'João Silva',client:1,contact:'',active:true,entryDate:'',exitDate:''},
      {id:3,name:'Carlos Mendes',client:2,contact:'',active:true,entryDate:'',exitDate:''}
    ];
    await saveConfig();
  }
  await loadMonthData();
  // load row colors
  const rc=await fbGet(`rowcolors/${monthKey()}`);
  if(rc) state.rowColors={...state.rowColors,...rc};
  state.loaded=true;
  showPage(state.page);
  setupListeners();
}

function monthKey(){return `${state.year}-${String(state.month+1).padStart(2,'0')}`;}

async function loadMonthData(){
  const mk=monthKey();
  const p=await fbGet(`presencas/${mk}`);if(p)state.presencas={...state.presencas,...p};
  const e=await fbGet(`entregas/${mk}`);if(e)state.entregas={...state.entregas,...e};
}

function setupListeners(){
  unsubListeners.forEach(u=>u());unsubListeners=[];
  const mk=monthKey();
  unsubListeners.push(
    fbListen(`presencas/${mk}`,d=>{state.presencas={...state.presencas,...d};if(state.page==='presencas')renderPresencas();if(state.page==='dashboard')renderDashboard();}),
    fbListen(`entregas/${mk}`,d=>{state.entregas={...state.entregas,...d};if(state.page==='entregas')renderEntregas();if(state.page==='dashboard')renderDashboard();}),
    fbListen(`rowcolors/${mk}`,d=>{state.rowColors={...state.rowColors,...d};if(state.page==='presencas')renderPresencas();}),
    fbListen('config/main',d=>{
      if(d.clients)state.clients=d.clients;
      if(d.motoristas)state.motoristas=d.motoristas.map(m=>({active:true,entryDate:'',exitDate:'',...m}));
      if(['clientes','motoristas','dashboard'].includes(state.page))showPage(state.page);
    })
  );
}

async function saveConfig(){await fbSet('config/main',{clients:state.clients,motoristas:state.motoristas});}
async function savePresencas(){await fbSet(`presencas/${monthKey()}`,state.presencas);}
async function saveEntregas(){await fbSet(`entregas/${monthKey()}`,state.entregas);}
async function saveRowColors(){await fbSet(`rowcolors/${monthKey()}`,state.rowColors);}

// ── HELPERS ────────────────────────────────────────────
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getDow(y,m,d){return new Date(y,m,d).getDay();}
function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}
function encodeF(f){return f.replace(/[^a-zA-Z0-9]/g,'_');}
function getPresence(y,m,d,mid){return state.presencas[`${y}-${m}-${d}-${mid}`]||'';}
function setPresence(y,m,d,mid,v){state.presencas[`${y}-${m}-${d}-${mid}`]=v;savePresencas();}
function getEntrega(cid,y,m,d,f){return Number(state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`])||0;}
function setEntrega(cid,y,m,d,f,v){state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`]=Number(v)||0;saveEntregas();}
function getRowColor(y,m,d){return state.rowColors[`rc-${y}-${m}-${d}`]||'';}
function setRowColor(y,m,d,color){state.rowColors[`rc-${y}-${m}-${d}`]=color;saveRowColors();}

function edrClass(v){if(v===null||v===undefined)return '';return v>=95?'edr-high':v>=80?'edr-mid':'edr-low';}

function statusClass(v){
  const map={'OK':'status-ok','Falta':'status-falta','Formação':'status-formacao','Back Up':'status-backup',
    'Backup Externo':'status-bext','Backup Interno':'status-bint','Folga':'status-folga'};
  return map[v]||'status-empty';
}

function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('pt-PT');}

// EDR calc: Entregues / Entregas * 100 (if both fields exist), else Entregues / total-of-non-Entregas
function calcRowEDR(client, vals){
  const hasEntregas = client.fields.includes('Entregas');
  const hasEntregues = client.fields.includes('Entregues');
  if(hasEntregas && hasEntregues){
    const base = vals['Entregas']||0;
    const done = vals['Entregues']||0;
    return base>0 ? Math.round((done/base)*100) : null;
  }
  // fallback: entregues / sum of all
  const total = client.fields.reduce((s,f)=>s+(vals[f]||0),0);
  const done = vals[client.fields[0]]||0;
  return total>0 ? Math.round((done/total)*100) : null;
}

function calcTotalEDR(client, totals){
  const hasEntregas = client.fields.includes('Entregas');
  const hasEntregues = client.fields.includes('Entregues');
  if(hasEntregas && hasEntregues){
    const base=totals['Entregas']||0, done=totals['Entregues']||0;
    return base>0?Math.round((done/base)*100):null;
  }
  const total=client.fields.reduce((s,f)=>s+(totals[f]||0),0);
  const done=totals[client.fields[0]]||0;
  return total>0?Math.round((done/total)*100):null;
}

function changeMonth(d){
  state.month+=d;
  if(state.month<0){state.month=11;state.year--;}if(state.month>11){state.month=0;state.year++;}
  loadMonthData().then(async()=>{
    const rc=await fbGet(`rowcolors/${monthKey()}`);if(rc)state.rowColors={...state.rowColors,...rc};
    setupListeners();showPage(state.page);
  });
}
function monthNav(){
  return `<div class="month-nav">
    <button onclick="window._cm(-1)">◀</button>
    <span>${MONTHS[state.month]} ${state.year}</span>
    <button onclick="window._cm(1)">▶</button>
  </div>`;
}

// ── ROUTER ─────────────────────────────────────────────
window._showPage=function(page){
  state.page=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick')?.includes(`'${page}'`)));
  const titles={dashboard:'Dashboard',presencas:'Presenças',entregas:'Entregas Diárias',clientes:'Clientes',motoristas:'Motoristas',relatorios:'Relatórios',historico:'Histórico de Edições'};
  document.getElementById('page-title').textContent=titles[page]||page;
  if(!state.loaded){document.getElementById('content').innerHTML='<div style="padding:40px;text-align:center;color:#666">A carregar...</div>';return;}
  ({dashboard:renderDashboard,presencas:renderPresencas,entregas:renderEntregas,clientes:renderClientes,motoristas:renderMotoristas,relatorios:renderRelatorios,historico:renderHistorico})[page]?.();
};
function showPage(p){window._showPage(p);}
window._cm=changeMonth;

// ── DASHBOARD ──────────────────────────────────────────
function renderDashboard(){
  const y=state.year,m=state.month,days=daysInMonth(y,m),today=new Date().getDate();
  const filterCid=state.dashboardClient==='all'?null:Number(state.dashboardClient);
  const clients=filterCid?state.clients.filter(c=>c.id===filterCid):state.clients;
  let totalEnt=0,totalBase=0;
  clients.forEach(c=>{
    for(let d=1;d<=days;d++){
      totalEnt+=getEntrega(c.id,y,m,d,c.fields.includes('Entregues')?'Entregues':c.fields[0]);
      totalBase+=getEntrega(c.id,y,m,d,c.fields.includes('Entregas')?'Entregas':c.fields[0]);
    }
  });
  const edrG=totalBase>0?Math.round((totalEnt/totalBase)*100):0;
  const motsFilt=(filterCid?state.motoristas.filter(mo=>mo.client===filterCid):state.motoristas).filter(mo=>mo.active!==false);
  let faltasHoje=0;motsFilt.forEach(mo=>{if(getPresence(y,m,today,mo.id)==='Falta')faltasHoje++;});

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <select onchange="window._dashFilter(this.value)" style="padding:6px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px">
      <option value="all" ${state.dashboardClient==='all'?'selected':''}>Todos os clientes</option>
      ${state.clients.map(c=>`<option value="${c.id}" ${state.dashboardClient==c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>`;

  document.getElementById('content').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card blue"><div class="label">Total Entregues</div><div class="value">${totalEnt.toLocaleString()}</div></div>
      <div class="stat-card blue"><div class="label">Total Entregas</div><div class="value">${totalBase.toLocaleString()}</div></div>
      <div class="stat-card green"><div class="label">EDR Geral</div><div class="value">${edrG}%</div></div>
      <div class="stat-card orange"><div class="label">Faltas Hoje</div><div class="value">${faltasHoje}</div></div>
      <div class="stat-card blue"><div class="label">Clientes</div><div class="value">${clients.length}</div></div>
      <div class="stat-card"><div class="label">Motoristas Ativos</div><div class="value">${motsFilt.length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Resumo por Cliente — ${MONTHS[m]} ${y}</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Cliente</th><th>Entregas</th><th>Entregues</th><th>EDR%</th><th>Motoristas</th></tr></thead>
        <tbody>${clients.map(c=>{
          let base=0,done=0;
          for(let d=1;d<=days;d++){
            base+=getEntrega(c.id,y,m,d,c.fields.includes('Entregas')?'Entregas':c.fields[0]);
            done+=getEntrega(c.id,y,m,d,c.fields.includes('Entregues')?'Entregues':c.fields[0]);
          }
          const edr=base>0?Math.round((done/base)*100):null;
          const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false).map(mo=>mo.name).join(', ');
          const dot=c.color?`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};margin-right:6px"></span>`:'';
          return `<tr><td>${dot}<strong>${c.name}</strong><br><small style="color:#5f6368">${c.location}</small></td>
            <td>${base.toLocaleString()}</td><td>${done.toLocaleString()}</td>
            <td class="edr-cell ${edrClass(edr)}">${edr!==null?edr+'%':'—'}</td><td>${mots||'—'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Atalhos Rápidos</span></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="window._showPage('presencas')">✅ Registar Presença</button>
        <button class="btn btn-primary" onclick="window._showPage('entregas')">📦 Lançar Entregas</button>
        <button class="btn btn-outline" onclick="window._showPage('relatorios')">📄 Relatórios</button>
        <button class="btn btn-outline" onclick="window._showPage('historico')">🕓 Histórico</button>
      </div>
    </div>`;
}
window._dashFilter=v=>{state.dashboardClient=v;renderDashboard();};

// ── PRESENÇAS ──────────────────────────────────────────
function renderPresencas(){
  const y=state.year,m=state.month,days=daysInMonth(y,m);
  const filterCids=state.presencaClients; // array of ids, empty = all
  let mots=state.motoristas.filter(mo=>mo.active!==false);
  if(filterCids.length>0) mots=mots.filter(mo=>filterCids.includes(mo.client));

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <button class="btn btn-outline btn-sm" onclick="window._exportPresExcel()">⬇ Excel</button>
    <button class="btn btn-outline btn-sm" onclick="window._exportPresPDF()">🖨️ PDF</button>`;

  // Multi-client filter checkboxes
  let filterBar=`<div class="card" style="padding:12px 16px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <span style="font-size:12px;font-weight:600;color:#5f6368">Filtrar clientes:</span>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
        <input type="checkbox" ${filterCids.length===0?'checked':''} onchange="window._presFilterAll(this)"> Todos
      </label>
      ${state.clients.map(c=>`
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
          <input type="checkbox" value="${c.id}" ${filterCids.includes(c.id)?'checked':''} onchange="window._presFilterToggle(${c.id},this)">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color||'#ccc'}"></span> ${c.name}
        </label>`).join('')}
    </div>
  </div>`;

  if(!mots.length){document.getElementById('content').innerHTML=filterBar+'<div class="card" style="padding:40px;text-align:center;color:#666">Nenhum motorista ativo para os clientes selecionados.</div>';return;}

  let html=filterBar+`<div class="card">
    <div class="card-header">
      <span class="card-title">Presenças — ${MONTHS[m]} ${y}</span>
      <div style="display:flex;gap:5px;flex-wrap:wrap;font-size:11px">
        <span class="leg leg-ok">✅ OK</span><span class="leg leg-falta">❌ Falta</span>
        <span class="leg leg-form">📘 Formação</span><span class="leg leg-back">🔄 Back Up</span>
        <span class="leg leg-bext">🟣 B.Ext</span><span class="leg leg-bint">🟠 B.Int</span>
        <span class="leg leg-folga">🏖️ Folga</span>
      </div>
    </div>
    <div class="presence-grid"><table class="presence-table" id="pres-table">
      <thead><tr>
        <th style="min-width:24px">🎨</th>
        <th>Dia Sem.</th><th>Dia</th>
        ${mots.map(mo=>{const c=state.clients.find(x=>x.id===mo.client);return `<th>${mo.name}${c&&filterCids.length!==1?`<br><small style="font-weight:400;opacity:.7">${c.name}</small>`:''}</th>`;}).join('')}
      </tr></thead><tbody>`;

  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    const customColor=getRowColor(y,m,d);
    const defaultBg=wk?'#fffde7':'#ffffff';
    const rowBg=customColor||defaultBg;
    html+=`<tr style="background:${rowBg}">
      <td style="text-align:center;padding:2px">
        <input type="color" value="${customColor||'#ffffff'}" title="Cor da linha"
          style="width:22px;height:22px;border:1px solid #ddd;border-radius:4px;cursor:pointer;padding:0"
          onchange="window._setRowColor(${y},${m},${d},this.value)">
      </td>
      <td class="day-info" style="font-size:11px;background:${rowBg}">${DAYS_PT[dow]}</td>
      <td class="day-info" style="font-weight:700;background:${rowBg}">${d}</td>
      ${mots.map(mo=>{
        const val=getPresence(y,m,d,mo.id);
        return `<td class="${statusClass(val)}" id="pc-${d}-${mo.id}" style="background-color:inherit">
          <select class="status-select" onchange="window._updatePres(${y},${m},${d},${mo.id},this)">
            ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===val?'selected':''}>${s||'—'}</option>`).join('')}
          </select></td>`;
      }).join('')}
    </tr>`;
  }

  // Totals
  html+=`<tr style="background:#f0f4f8;font-weight:700"><td></td><td colspan="2" style="text-align:right;padding:8px 12px">Totais</td>
    ${mots.map(mo=>{
      let ok=0,fal=0,form=0,back=0,bext=0,bint=0,folga=0;
      for(let d=1;d<=days;d++){const v=getPresence(y,m,d,mo.id);
        if(v==='OK')ok++;else if(v==='Falta')fal++;else if(v==='Formação')form++;
        else if(v==='Back Up')back++;else if(v==='Backup Externo')bext++;else if(v==='Backup Interno')bint++;else if(v==='Folga')folga++;}
      return `<td style="font-size:11px;text-align:center">${ok?`✅${ok} `:''}${fal?`❌${fal} `:''}${form?`📘${form} `:''}${back?`🔄${back} `:''}${bext?`🟣${bext} `:''}${bint?`🟠${bint} `:''}${folga?`🏖️${folga}`:''}`;
    }).join('')}
  </tr></tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
}

window._presFilterAll=chk=>{
  if(chk.checked) state.presencaClients=[];
  renderPresencas();
};
window._presFilterToggle=(cid,chk)=>{
  if(chk.checked){if(!state.presencaClients.includes(cid))state.presencaClients.push(cid);}
  else state.presencaClients=state.presencaClients.filter(x=>x!==cid);
  renderPresencas();
};
window._updatePres=(y,m,d,mid,sel)=>{
  const old=getPresence(y,m,d,mid);
  setPresence(y,m,d,mid,sel.value);
  logAction('Presença alterada',`Motorista ID ${mid} | Dia ${d}/${m+1}/${y} | ${old||'—'} → ${sel.value||'—'}`);
  const cell=document.getElementById(`pc-${d}-${mid}`);
  if(cell) cell.className=statusClass(sel.value);
};
window._setRowColor=(y,m,d,color)=>{
  setRowColor(y,m,d,color==='#ffffff'?'':color);
  logAction('Cor de linha alterada',`Dia ${d}/${m+1}/${y} → ${color}`);
};

// ── ENTREGAS ───────────────────────────────────────────
function renderEntregas(){
  const y=state.year,m=state.month;
  if(!state.selectedClient||!state.clients.find(c=>c.id===state.selectedClient)) state.selectedClient=state.clients[0]?.id||null;
  const client=state.clients.find(c=>c.id===state.selectedClient);

  document.getElementById('topbar-actions').innerHTML=`${monthNav()}
    <button class="btn btn-outline btn-sm" onclick="window._exportEntExcel()">⬇ Excel</button>
    <button class="btn btn-outline btn-sm" onclick="window._exportEntPDF()">🖨️ PDF</button>`;

  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
    <span style="font-size:12px;font-weight:600;color:#5f6368">Cliente:</span>
    ${state.clients.map(c=>`<div class="pill ${c.id===state.selectedClient?'active':''}"
      style="${c.id===state.selectedClient&&c.color?`background:${c.color};border-color:${c.color};color:#333`:''}"
      onclick="window._selClient(${c.id})">${c.name}</div>`).join('')}
  </div>`;

  if(!client){document.getElementById('content').innerHTML=html+'<div class="card" style="padding:40px;text-align:center">Nenhum cliente.</div>';return;}

  const clientColor=client.color||'#ffffff';
  const headerColor=lightenColor(clientColor,0.4);
  const days=daysInMonth(y,m),fields=client.fields,totals={};
  fields.forEach(f=>totals[f]=0);

  html+=`<div class="card" style="border-top:4px solid ${clientColor}">
    <div class="card-header" style="background:${headerColor};margin:-20px -20px 16px;padding:16px 20px;border-radius:12px 12px 0 0">
      <span class="card-title">${client.name} — ${MONTHS[m]} ${y}</span>
      <span style="font-size:12px;color:#5f6368">${state.motoristas.filter(mo=>mo.client===client.id&&mo.active!==false).map(m=>m.name).join(', ')}</span>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr style="background:${headerColor}">
        <th>Dia Sem.</th><th>Dia</th>
        ${fields.map(f=>`<th>${f}</th>`).join('')}
        <th>EDR%</th>
      </tr></thead><tbody>`;

  let activeDays=0;
  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    const customColor=getRowColor(y,m,d);
    const rowBg=customColor||(wk?'#fffde7':clientColor+'22');
    const vals={};fields.forEach(f=>{vals[f]=getEntrega(client.id,y,m,d,f);totals[f]+=vals[f];});
    const rowSum=fields.reduce((s,f)=>s+(vals[f]||0),0);
    if(rowSum>0) activeDays++;
    const edrVal=calcRowEDR(client,vals);
    html+=`<tr style="background:${rowBg}">
      <td style="font-size:11px">${DAYS_PT[dow]}</td>
      <td style="font-weight:700">${d}</td>
      ${fields.map(f=>`<td><input class="delivery-input" type="number" min="0" value="${vals[f]||''}" placeholder="0"
        onchange="window._updateEnt(${client.id},${y},${m},${d},'${encodeF(f)}','${f}',this.value,${d})" /></td>`).join('')}
      <td class="edr-cell ${edrClass(edrVal)}" id="edr-${d}">${edrVal!==null?edrVal+'%':'—'}</td>
    </tr>`;
  }

  // Total row
  const edrTotal=calcTotalEDR(client,totals);
  html+=`<tr style="background:${headerColor};font-weight:700" id="totals-row">
    <td colspan="2">Total</td>
    ${fields.map(f=>`<td id="ctotal-${encodeF(f)}">${totals[f].toLocaleString()}</td>`).join('')}
    <td class="edr-cell ${edrClass(edrTotal)}" id="edr-total">${edrTotal!==null?edrTotal+'%':'—'}</td>
  </tr>`;

  // Media row
  const mediaEDR=edrTotal; // same as total EDR
  html+=`<tr style="background:${clientColor}33;font-style:italic;color:#555">
    <td colspan="2" style="font-size:12px">Média (${activeDays} dias)</td>
    ${fields.map(f=>`<td id="cmedia-${encodeF(f)}" style="font-size:12px">${activeDays>0?Math.round(totals[f]/activeDays):0}</td>`).join('')}
    <td class="edr-cell ${edrClass(mediaEDR)}" style="font-size:12px">${mediaEDR!==null?mediaEDR+'%':'—'}</td>
  </tr>`;

  html+=`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
}

function lightenColor(hex,amount){
  // mix hex with white
  try{
    hex=hex.replace('#','');
    const r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16);
    const nr=Math.round(r+(255-r)*amount),ng=Math.round(g+(255-g)*amount),nb=Math.round(b+(255-b)*amount);
    return `rgb(${nr},${ng},${nb})`;
  }catch(e){return '#f8f9fa';}
}

window._selClient=id=>{state.selectedClient=id;renderEntregas();};
window._updateEnt=(cid,y,m,d,fKey,fLabel,val,day)=>{
  const old=getEntrega(cid,y,m,d,fLabel);
  setEntrega(cid,y,m,d,fLabel,val);
  const client=state.clients.find(c=>c.id===cid);
  logAction('Entrega editada',`Cliente: ${client?.name} | Campo: ${fLabel} | Dia ${d}/${m+1}/${y} | ${old} → ${val}`);
  if(!client)return;
  const vals={};client.fields.forEach(f=>vals[f]=getEntrega(cid,y,m,d,f));
  const edrVal=calcRowEDR(client,vals);
  const ec=document.getElementById(`edr-${day}`);if(ec){ec.textContent=edrVal!==null?edrVal+'%':'—';ec.className=`edr-cell ${edrClass(edrVal)}`;}
  // recalc totals
  const totals={};client.fields.forEach(f=>{let s=0;for(let dd=1;dd<=daysInMonth(y,m);dd++)s+=getEntrega(cid,y,m,dd,f);totals[f]=s;});
  client.fields.forEach(f=>{const el=document.getElementById(`ctotal-${encodeF(f)}`);if(el)el.textContent=totals[f].toLocaleString();});
  const edrT=calcTotalEDR(client,totals);
  const et=document.getElementById('edr-total');if(et){et.textContent=edrT!==null?edrT+'%':'—';et.className=`edr-cell ${edrClass(edrT)}`;}
  // recalc media
  let activeDays=0;
  for(let dd=1;dd<=daysInMonth(y,m);dd++){const s=client.fields.reduce((x,f)=>x+getEntrega(cid,y,m,dd,f),0);if(s>0)activeDays++;}
  client.fields.forEach(f=>{const el=document.getElementById(`cmedia-${encodeF(f)}`);if(el)el.textContent=activeDays>0?Math.round(totals[f]/activeDays):0;});
};

function dateRange(s,e){
  const start=new Date(s),end=new Date(e),res=[];
  const cur=new Date(start);
  while(cur<=end){res.push({y:cur.getFullYear(),m:cur.getMonth(),d:cur.getDate()});cur.setDate(cur.getDate()+1);}
  return res;
}
async function ensureMonth(y,m){
  const mk=`${y}-${String(m+1).padStart(2,'0')}`;
  const p=await fbGet(`presencas/${mk}`);if(p)state.presencas={...state.presencas,...p};
  const e=await fbGet(`entregas/${mk}`);if(e)state.entregas={...state.entregas,...e};
}

window._exportExcelPeriod=async()=>{
  const type=document.getElementById('rep-type').value,clientId=document.getElementById('rep-client').value;
  const startStr=document.getElementById('rep-start').value,endStr=document.getElementById('rep-end').value;
  if(!startStr||!endStr)return alert('Selecione as datas');
  const days=dateRange(startStr,endStr);
  const months=[...new Set(days.map(x=>`${x.y}-${x.m}`))];
  for(const mk of months){const[y,m]=mk.split('-').map(Number);await ensureMonth(y,m);}
  const wb=XLSX.utils.book_new();
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  if(type==='presencas'){
    const mots=clientId==='all'?state.motoristas.filter(m=>m.active!==false):state.motoristas.filter(m=>m.client===Number(clientId)&&m.active!==false);
    const rows=[['Data','Dia Semana',...mots.map(m=>m.name)]];
    days.forEach(({y,m,d})=>rows.push([`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)],...mots.map(mo=>getPresence(y,m,d,mo.id)||'')]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Presenças');
  } else {
    clients.forEach(c=>{
      const tots={};c.fields.forEach(f=>tots[f]=0);
      const rows=[['Data','Dia',...c.fields,'EDR%']];
      days.forEach(({y,m,d})=>{
        const vals=c.fields.map(f=>{const v=getEntrega(c.id,y,m,d,f);tots[f]+=v;return v;});
        const vobj={};c.fields.forEach((f,i)=>vobj[f]=vals[i]);
        rows.push([`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)],...vals,calcRowEDR(c,vobj)!==null?calcRowEDR(c,vobj)+'%':'']);
      });
      const edrT=calcTotalEDR(c,tots);
      rows.push(['TOTAL','',...c.fields.map(f=>tots[f]),edrT!==null?edrT+'%':'']);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.name.substring(0,31));
    });
  }
  XLSX.writeFile(wb,`relatorio_${startStr}_${endStr}.xlsx`);
  logAction('Excel exportado',`Tipo:${type} | ${startStr} a ${endStr}`);
};

window._exportPDFPeriod=async()=>{
  const type=document.getElementById('rep-type').value,clientId=document.getElementById('rep-client').value;
  const startStr=document.getElementById('rep-start').value,endStr=document.getElementById('rep-end').value;
  if(!startStr||!endStr)return alert('Selecione as datas');
  const days=dateRange(startStr,endStr);
  const months=[...new Set(days.map(x=>`${x.y}-${x.m}`))];
  for(const mk of months){const[y,m]=mk.split('-').map(Number);await ensureMonth(y,m);}
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  let html=`<html><head><style>body{font-family:Arial;font-size:10px;padding:16px}h2{color:#1a73e8}h3{margin:14px 0 6px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#1e2a3a;color:#fff;padding:5px 6px}td{padding:4px 6px;border-bottom:1px solid #eee}.eh{color:#137333;font-weight:700}.el{color:#c5221f;font-weight:700}.tr td{background:#e8f0fe!important;font-weight:700}</style></head><body>
  <h2>TrafficLogistics DE — ${startStr} a ${endStr}</h2>`;
  if(type==='presencas'){
    const mots=clientId==='all'?state.motoristas.filter(m=>m.active!==false):state.motoristas.filter(m=>m.client===Number(clientId)&&m.active!==false);
    html+=`<table><thead><tr><th>Data</th><th>Semana</th>${mots.map(m=>`<th>${m.name}</th>`).join('')}</tr></thead><tbody>`;
    days.forEach(({y,m,d})=>{html+=`<tr><td>${d}/${m+1}/${y}</td><td>${DAYS_PT[getDow(y,m,d)]}</td>${mots.map(mo=>`<td>${getPresence(y,m,d,mo.id)||'—'}</td>`).join('')}</tr>`;});
    html+=`</tbody></table>`;
  } else {
    clients.forEach(c=>{
      const tots={};c.fields.forEach(f=>tots[f]=0);
      html+=`<h3>${c.name}</h3><table><thead><tr><th>Data</th>${c.fields.map(f=>`<th>${f}</th>`).join('')}<th>EDR%</th></tr></thead><tbody>`;
      days.forEach(({y,m,d})=>{
        const vals=c.fields.map(f=>{const v=getEntrega(c.id,y,m,d,f);tots[f]+=v;return v;});
        const vobj={};c.fields.forEach((f,i)=>vobj[f]=vals[i]);
        const rt=vals.reduce((a,b)=>a+b,0);if(rt===0)return;
        const edr=calcRowEDR(c,vobj);
        html+=`<tr><td>${d}/${m+1}/${y}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}<td class="${edr!==null?(edr>=95?'eh':edr<80?'el':''):''}">${edr!==null?edr+'%':'—'}</td></tr>`;
      });
      const edrT=calcTotalEDR(c,tots);
      html+=`<tr class="tr"><td>TOTAL</td>${c.fields.map(f=>`<td>${tots[f]}</td>`).join('')}<td>${edrT!==null?edrT+'%':'—'}</td></tr></tbody></table>`;
    });
  }
  html+=`</body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
};

  let html=`<html><head><style>body{font-family:Arial;font-size:9px;padding:12px}h2{color:#1a73e8;margin-bottom:6px}table{width:100%;border-collapse:collapse}th{background:#1e2a3a;color:#fff;padding:4px 5px}td{padding:3px 5px;border-bottom:1px solid #eee;text-align:center}.wi{background:#fffde7}</style></head><body>
  <h2>Presenças — ${MONTHS[m]} ${y}</h2><table><thead><tr><th>Dia</th><th>Semana</th>${mots.map(mo=>`<th>${mo.name}</th>`).join('')}</tr></thead><tbody>`;
  for(let d=1;d<=days;d++){const dow=getDow(y,m,d),wk=dow===0||dow===6;html+=`<tr class="${wk?'wi':''}"><td>${d}</td><td>${DAYS_PT[dow]}</td>${mots.map(mo=>`<td>${getPresence(y,m,d,mo.id)||'—'}</td>`).join('')}</tr>`;}
  html+=`</tbody></table></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
};
window._exportEntExcel=()=>{
  const client=state.clients.find(c=>c.id===state.selectedClient);if(!client)return;
  const y=state.year,m=state.month,days=daysInMonth(y,m),tots={};
  client.fields.forEach(f=>tots[f]=0);
  const wb=XLSX.utils.book_new();
  const rows=[['Dia Semana','Dia',...client.fields,'EDR%']];
  for(let d=1;d<=days;d++){
    const vals=client.fields.map(f=>{const v=getEntrega(client.id,y,m,d,f);tots[f]+=v;return v;});
    const vobj={};client.fields.forEach((f,i)=>vobj[f]=vals[i]);
    const edr=calcRowEDR(client,vobj);
    rows.push([DAYS_PT[getDow(y,m,d)],d,...vals,edr!==null?edr+'%':'']);
  }
  const edrT=calcTotalEDR(client,tots);
  rows.push(['TOTAL','',...client.fields.map(f=>tots[f]),edrT!==null?edrT+'%':'']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),client.name);
  XLSX.writeFile(wb,`${client.name}_${MONTHS[m]}_${y}.xlsx`);
};
window._exportEntPDF=()=>{
  const client=state.clients.find(c=>c.id===state.selectedClient);if(!client)return;
  const y=state.year,m=state.month,days=daysInMonth(y,m),tots={};
  client.fields.forEach(f=>tots[f]=0);
  const hc=client.color||'#e3f2fd';
  let html=`<html><head><style>body{font-family:Arial;font-size:9px;padding:12px}h2{color:#1a73e8;margin-bottom:6px}table{width:100%;border-collapse:collapse}th{background:#1e2a3a;color:#fff;padding:4px 5px}td{padding:3px 5px;border-bottom:1px solid #eee;text-align:center}.wi{background:#fffde7}.eh{color:#137333;font-weight:700}.el{color:#c5221f;font-weight:700}.tr td{background:${hc}!important;font-weight:700}</style></head><body>
  <h2>${client.name} — ${MONTHS[m]} ${y}</h2><table><thead><tr><th>Dia</th><th>Sem.</th>${client.fields.map(f=>`<th>${f}</th>`).join('')}<th>EDR%</th></tr></thead><tbody>`;
  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    const vals=client.fields.map(f=>{const v=getEntrega(client.id,y,m,d,f);tots[f]+=v;return v;});
    const vobj={};client.fields.forEach((f,i)=>vobj[f]=vals[i]);
    const edr=calcRowEDR(client,vobj);
    html+=`<tr class="${wk?'wi':''}"><td>${d}</td><td>${DAYS_PT[dow].substring(0,3)}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}<td class="${edr!==null?(edr>=95?'eh':edr<80?'el':''):''}">${edr!==null?edr+'%':'—'}</td></tr>`;
  }
  const edrT=calcTotalEDR(client,tots);
  html+=`<tr class="tr"><td colspan="2">TOTAL</td>${client.fields.map(f=>`<td>${tots[f]}</td>`).join('')}<td>${edrT!==null?edrT+'%':'—'}</td></tr>`;
  html+=`</tbody></table></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
};

// ── HISTÓRICO ──────────────────────────────────────────
async function renderHistorico(){
  document.getElementById('topbar-actions').innerHTML='';
  document.getElementById('content').innerHTML='<div class="card"><div style="padding:20px;text-align:center;color:#666">A carregar...</div></div>';
  try{
    const q=query(collection(db,'audit_log'),orderBy('ts','desc'),limit(300));
    const snap=await getDocs(q);const logs=[];snap.forEach(d=>logs.push(d.data()));
    document.getElementById('content').innerHTML=`<div class="card">
      <div class="card-header"><span class="card-title">Histórico de Edições</span><span style="font-size:12px;color:#5f6368">Últimas ${logs.length} ações</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Data/Hora</th><th>Utilizador</th><th>Ação</th><th>Detalhes</th></tr></thead>
        <tbody>${logs.length?logs.map(l=>{
          const dt=new Date(l.ts);
          return `<tr><td style="white-space:nowrap;font-size:12px">${dt.toLocaleDateString('pt-PT')} ${dt.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</td>
            <td><strong>${l.user}</strong></td>
            <td><span class="badge badge-ok" style="font-size:11px">${l.action}</span></td>
            <td style="font-size:12px">${l.details}</td></tr>`;
        }).join(''):'<tr><td colspan="4" style="text-align:center;color:#666;padding:20px">Sem registos ainda.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  }catch(e){document.getElementById('content').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#c5221f">Erro ao carregar histórico.</div>';}
}

// ── MODAL ──────────────────────────────────────────────
window._closeModal=()=>document.getElementById('modal-overlay').classList.add('hidden');

// ── AUTH ───────────────────────────────────────────────
window._doLogin=async()=>{
  const email=document.getElementById('login-email').value.trim(),pass=document.getElementById('login-pass').value;
  document.getElementById('login-err').textContent='';
  try{await signInWithEmailAndPassword(auth,email,pass);}
  catch(e){document.getElementById('login-err').textContent='Email ou password incorretos.';}
};
window._doLogout=async()=>await signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){currentUser=user;document.getElementById('user-email').textContent=user.email;
    document.getElementById('login-screen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAllData();}
  else{currentUser=null;document.getElementById('app').classList.add('hidden');document.getElementById('login-screen').classList.remove('hidden');}
});
</script>

<style>
