<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficLogistics DE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeml3PjKrK9mWXKjKCtsdyTlj8ZLfHic8",
  authDomain: "trafficlogistics-de.firebaseapp.com",
  projectId: "trafficlogistics-de",
  storageBucket: "trafficlogistics-de.firebasestorage.app",
  messagingSenderId: "236059665812",
  appId: "1:236059665812:web:c926097f6a7ed252a85b81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_PT=['dom','seg','ter','qua','qui','sex','sáb'];
const STATUS_OPTIONS=['','OK','Falta','Formação','Back Up','Backup Externo','Backup Interno','Folga'];
const ALL_FIELDS=['Entregas','Entregues','Incidências','Não Visitados','Recolhas','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados','Saldo','Tentativas','Devoluções'];

let currentUser=null;
let state={
  page:'dashboard',month:new Date().getMonth(),year:new Date().getFullYear(),
  selectedClient:null,dashboardClient:'all',presencaClients:[],
  clients:[],motoristas:[],presencas:{},entregas:{},rowColors:{},loaded:false
};
let unsubListeners=[];

async function logAction(action,details){
  try{await addDoc(collection(db,'audit_log'),{user:currentUser?.email||'unknown',action,details,ts:new Date().toISOString()});}catch(e){}
}
async function fbSet(path,data){try{await setDoc(doc(db,path),data,{merge:true});}catch(e){}}
async function fbGet(path){try{const d=await getDoc(doc(db,path));return d.exists()?d.data():null;}catch(e){return null;}}
function fbListen(path,cb){return onSnapshot(doc(db,path),s=>{if(s.exists())cb(s.data());});}

async function loadAllData(){
  const cfg=await fbGet('config/main');
  if(cfg){
    state.clients=(cfg.clients||[]).map(c=>({color:'#6366f1',showEDR:true,subcategories:[],...c}));
    state.motoristas=(cfg.motoristas||[]).map(m=>({active:true,entryDate:'',exitDate:'',dualShift:false,...m}));
    if(state.clients.length&&!state.selectedClient) state.selectedClient=state.clients[0].id;
  } else {
    state.clients=[
      {id:1,name:'Telheiras',location:'Lisboa',color:'#6366f1',fields:['Entregas','Entregues','Incidências','Não Visitados'],showEDR:true,subcategories:[]},
      {id:2,name:'JustSushi',location:'Portugal',color:'#ec4899',fields:['Entregas','Entregues'],showEDR:false,subcategories:[{id:'2a',name:'Évora'},{id:'2b',name:'Coimbra'}]}
    ];
    state.motoristas=[
      {id:1,name:'Rodrigo',client:1,subcat:null,contact:'',active:true,entryDate:'',exitDate:'',dualShift:false},
      {id:2,name:'Luis Carlos',client:2,subcat:'2a',contact:'933710366',active:true,entryDate:'',exitDate:'',dualShift:true},
      {id:3,name:'Fernando',client:2,subcat:'2b',contact:'',active:true,entryDate:'',exitDate:'',dualShift:false}
    ];
    await saveConfig();
  }
  await loadMonthData();
  const rc=await fbGet(`rowcolors/${monthKey()}`);
  if(rc) state.rowColors={...state.rowColors,...rc};
  state.loaded=true;
  showPage(state.page);
  setupListeners();
}

function monthKey(){return `${state.year}-${String(state.month+1).padStart(2,'0')}`;}
async function loadMonthData(){
  const mk=monthKey();
  const p=await fbGet(`presencas/${mk}`);if(p)state.presencas={...state.presencas,...p};
  const e=await fbGet(`entregas/${mk}`);if(e)state.entregas={...state.entregas,...e};
}
function setupListeners(){
  unsubListeners.forEach(u=>u());unsubListeners=[];
  const mk=monthKey();
  unsubListeners.push(
    fbListen(`presencas/${mk}`,d=>{state.presencas={...state.presencas,...d};if(state.page==='presencas')renderPresencas();if(state.page==='dashboard')renderDashboard();}),
    fbListen(`entregas/${mk}`,d=>{state.entregas={...state.entregas,...d};if(state.page==='entregas')renderEntregas();if(state.page==='dashboard')renderDashboard();}),
    fbListen(`rowcolors/${mk}`,d=>{state.rowColors={...state.rowColors,...d};if(state.page==='presencas')renderPresencas();}),
    fbListen('config/main',d=>{
      if(d.clients)state.clients=d.clients.map(c=>({color:'#6366f1',showEDR:true,subcategories:[],...c}));
      if(d.motoristas)state.motoristas=d.motoristas.map(m=>({active:true,entryDate:'',exitDate:'',dualShift:false,...m}));
      if(['clientes','motoristas','dashboard'].includes(state.page))showPage(state.page);
    })
  );
}
async function saveConfig(){await fbSet('config/main',{clients:state.clients,motoristas:state.motoristas});}
async function savePresencas(){await fbSet(`presencas/${monthKey()}`,state.presencas);}
async function saveEntregas(){await fbSet(`entregas/${monthKey()}`,state.entregas);}
async function saveRowColors(){await fbSet(`rowcolors/${monthKey()}`,state.rowColors);}

function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getDow(y,m,d){return new Date(y,m,d).getDay();}
function nextId(arr){return arr.length?Math.max(...arr.map(x=>typeof x.id==='number'?x.id:0))+1:1;}
function encodeF(f){return f.replace(/[^a-zA-Z0-9]/g,'_');}
function getPres(y,m,d,mid,t=''){return state.presencas[`${y}-${m}-${d}-${mid}${t?'-'+t:''}`]||'';}
function setPres(y,m,d,mid,t,v){state.presencas[`${y}-${m}-${d}-${mid}${t?'-'+t:''}`]=v;savePresencas();}
function getEnt(cid,y,m,d,mid,f){return Number(state.entregas[`${cid}-${y}-${m}-${d}-${mid}-${encodeF(f)}`])||0;}
function setEnt(cid,y,m,d,mid,f,v){state.entregas[`${cid}-${y}-${m}-${d}-${mid}-${encodeF(f)}`]=Number(v)||0;saveEntregas();}
function getRowColor(y,m,d){return state.rowColors[`rc-${y}-${m}-${d}`]||'';}
function setRowColor(y,m,d,color){state.rowColors[`rc-${y}-${m}-${d}`]=color;saveRowColors();}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('pt-PT');}

function edrBadge(v){
  if(v===null||v===undefined) return '<span style="color:#94a3b8">—</span>';
  const cls=v>=95?'badge-success':v>=80?'badge-warning':'badge-danger';
  return `<span class="badge ${cls}">${v}%</span>`;
}
function statusPill(v){
  const map={
    'OK':'pill-ok','Falta':'pill-falta','Formação':'pill-form',
    'Back Up':'pill-backup','Backup Externo':'pill-bext','Backup Interno':'pill-bint','Folga':'pill-folga'
  };
  return map[v]||'pill-empty';
}
function calcEDR(client,base,done){
  if(!client.showEDR) return null;
  return base>0?Math.round((done/base)*100):null;
}
function hexToRgba(hex,a){
  try{hex=hex.replace('#','');const r=parseInt(hex.substring(0,2),16),g=parseInt(hex.substring(2,4),16),b=parseInt(hex.substring(4,6),16);return `rgba(${r},${g},${b},${a})`;}
  catch(e){return `rgba(99,102,241,${a})`;}
}

function changeMonth(d){
  state.month+=d;
  if(state.month<0){state.month=11;state.year--;}if(state.month>11){state.month=0;state.year++;}
  loadMonthData().then(async()=>{const rc=await fbGet(`rowcolors/${monthKey()}`);if(rc)state.rowColors={...state.rowColors,...rc};setupListeners();showPage(state.page);});
}

function monthNavHTML(){
  return `<div class="month-nav">
    <button class="icon-btn" onclick="window._cm(-1)"><i class="ti ti-chevron-left"></i></button>
    <span class="month-label">${MONTHS[state.month]} ${state.year}</span>
    <button class="icon-btn" onclick="window._cm(1)"><i class="ti ti-chevron-right"></i></button>
  </div>`;
}

window._showPage=function(page){
  state.page=page;
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active',el.dataset.page===page));
  if(!state.loaded){document.getElementById('content').innerHTML='<div class="loading-state"><i class="ti ti-loader-2 spin"></i><p>A carregar dados…</p></div>';return;}
  ({dashboard:renderDashboard,presencas:renderPresencas,entregas:renderEntregas,clientes:renderClientes,motoristas:renderMotoristas,relatorios:renderRelatorios,historico:renderHistorico})[page]?.();
};
function showPage(p){window._showPage(p);}
window._cm=changeMonth;

// ── DASHBOARD ────────────────────────────────────────────
function renderDashboard(){
  const y=state.year,m=state.month,days=daysInMonth(y,m),today=new Date().getDate();
  const filterCid=state.dashboardClient==='all'?null:Number(state.dashboardClient);
  const clients=filterCid?state.clients.filter(c=>c.id===filterCid):state.clients;
  let totalBase=0,totalDone=0;
  clients.forEach(c=>{
    const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false);
    const eff=mots.length>0?mots:[{id:0}];
    for(let d=1;d<=days;d++){eff.forEach(mo=>{totalBase+=getEnt(c.id,y,m,d,mo.id,'Entregas');totalDone+=getEnt(c.id,y,m,d,mo.id,'Entregues');});}
  });
  const edrG=totalBase>0?Math.round((totalDone/totalBase)*100):0;
  const motsFilt=(filterCid?state.motoristas.filter(mo=>mo.client===filterCid):state.motoristas).filter(mo=>mo.active!==false);
  let faltasHoje=0;
  motsFilt.forEach(mo=>{if(getPres(y,m,today,mo.id,mo.dualShift?'a':'')==='Falta')faltasHoje++;});

  document.getElementById('page-header').innerHTML=`
    <div class="page-title-area">
      <h1>Dashboard</h1>
      <p class="page-sub">${MONTHS[m]} ${y}</p>
    </div>
    <div class="header-actions">
      ${monthNavHTML()}
      <select class="select-input" onchange="window._dashFilter(this.value)">
        <option value="all">Todos os clientes</option>
        ${state.clients.map(c=>`<option value="${c.id}" ${state.dashboardClient==c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>`;

  document.getElementById('content').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#6366f1',0.12)};color:#6366f1"><i class="ti ti-truck-delivery"></i></div>
        <div class="kpi-body"><p class="kpi-label">Total Entregas</p><p class="kpi-value">${totalBase.toLocaleString()}</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#10b981',0.12)};color:#10b981"><i class="ti ti-circle-check"></i></div>
        <div class="kpi-body"><p class="kpi-label">Total Entregues</p><p class="kpi-value">${totalDone.toLocaleString()}</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#f59e0b',0.12)};color:#f59e0b"><i class="ti ti-chart-line"></i></div>
        <div class="kpi-body"><p class="kpi-label">EDR Geral</p><p class="kpi-value">${edrG}%</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#ef4444',0.12)};color:#ef4444"><i class="ti ti-user-x"></i></div>
        <div class="kpi-body"><p class="kpi-label">Faltas hoje</p><p class="kpi-value">${faltasHoje}</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#8b5cf6',0.12)};color:#8b5cf6"><i class="ti ti-building-store"></i></div>
        <div class="kpi-body"><p class="kpi-label">Clientes</p><p class="kpi-value">${clients.length}</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:${hexToRgba('#0ea5e9',0.12)};color:#0ea5e9"><i class="ti ti-users"></i></div>
        <div class="kpi-body"><p class="kpi-label">Motoristas ativos</p><p class="kpi-value">${motsFilt.length}</p></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Resumo por cliente</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Cliente</th><th>Loja</th><th>Entregas</th><th>Entregues</th><th>EDR%</th><th>Motoristas</th></tr></thead>
        <tbody>${clients.flatMap(c=>{
          const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false);
          const eff=mots.length>0?mots:[{id:0}];
          const hasSubs=c.subcategories?.length>0;
          const dot=`<span class="client-dot" style="background:${c.color||'#6366f1'}"></span>`;
          if(hasSubs){
            const subRows=c.subcategories.map(sub=>{
              const sm=mots.filter(mo=>mo.subcat===sub.id);
              const se=sm.length>0?sm:[{id:0}];
              let base=0,done=0;
              for(let d=1;d<=days;d++){se.forEach(mo=>{base+=getEnt(c.id,y,m,d,mo.id,'Entregas');done+=getEnt(c.id,y,m,d,mo.id,'Entregues');});}
              return `<tr class="sub-row"><td style="padding-left:2.5rem">${sub.name}</td><td><span class="chip">${sub.name}</span></td><td>${base.toLocaleString()}</td><td>${done.toLocaleString()}</td><td>${edrBadge(calcEDR(c,base,done))}</td><td class="muted">${sm.map(m=>m.name).join(', ')||'—'}</td></tr>`;
            });
            let tb=0,td2=0;
            for(let d=1;d<=days;d++){eff.forEach(mo=>{tb+=getEnt(c.id,y,m,d,mo.id,'Entregas');td2+=getEnt(c.id,y,m,d,mo.id,'Entregues');});}
            const parentRow=`<tr class="parent-row"><td>${dot}<strong>${c.name}</strong> <span class="muted" style="font-size:12px">${c.location}</span></td><td><span class="chip chip-total">Total</span></td><td><strong>${tb.toLocaleString()}</strong></td><td><strong>${td2.toLocaleString()}</strong></td><td>${edrBadge(calcEDR(c,tb,td2))}</td><td class="muted">${mots.map(m=>m.name).join(', ')||'—'}</td></tr>`;
            return [parentRow,...subRows];
          }
          let base=0,done=0;
          for(let d=1;d<=days;d++){eff.forEach(mo=>{base+=getEnt(c.id,y,m,d,mo.id,'Entregas');done+=getEnt(c.id,y,m,d,mo.id,'Entregues');});}
          return [`<tr><td>${dot}<strong>${c.name}</strong> <span class="muted" style="font-size:12px">${c.location}</span></td><td>—</td><td>${base.toLocaleString()}</td><td>${done.toLocaleString()}</td><td>${edrBadge(calcEDR(c,base,done))}</td><td class="muted">${mots.map(m=>m.name).join(', ')||'—'}</td></tr>`];
        }).join('')}</tbody>
      </table></div>
    </div>`;
}
window._dashFilter=v=>{state.dashboardClient=v;renderDashboard();};

// ── PRESENÇAS ─────────────────────────────────────────────
function renderPresencas(){
  const y=state.year,m=state.month,days=daysInMonth(y,m);
  let mots=state.motoristas.filter(mo=>mo.active!==false);
  if(state.presencaClients.length>0) mots=mots.filter(mo=>state.presencaClients.includes(mo.client));

  document.getElementById('page-header').innerHTML=`
    <div class="page-title-area"><h1>Presenças</h1><p class="page-sub">${MONTHS[m]} ${y}</p></div>
    <div class="header-actions">
      ${monthNavHTML()}
      <button class="btn btn-outline" onclick="window._exportPresExcel()"><i class="ti ti-table-export"></i> Excel</button>
      <button class="btn btn-outline" onclick="window._exportPresPDF()"><i class="ti ti-printer"></i> PDF</button>
    </div>`;

  let html=`<div class="filter-card">
    <span class="filter-label"><i class="ti ti-filter"></i> Filtrar clientes</span>
    <label class="filter-check"><input type="checkbox" ${state.presencaClients.length===0?'checked':''} onchange="window._presFilterAll(this)"> Todos</label>
    ${state.clients.map(c=>`<label class="filter-check"><input type="checkbox" value="${c.id}" ${state.presencaClients.includes(c.id)?'checked':''} onchange="window._presFilterToggle(${c.id},this)"><span class="client-dot" style="background:${c.color||'#6366f1'}"></span>${c.name}</label>`).join('')}
  </div>`;

  if(!mots.length){document.getElementById('content').innerHTML=html+'<div class="empty-state"><i class="ti ti-users-group"></i><p>Nenhum motorista ativo para os clientes selecionados.</p></div>';return;}

  let headerCols='';
  mots.forEach(mo=>{
    const c=state.clients.find(x=>x.id===mo.client);
    const color=c?.color||'#6366f1';
    const sub=c?.subcategories?.find(s=>s.id===mo.subcat);
    if(mo.dualShift){
      headerCols+=`<th colspan="2" style="border-bottom:3px solid ${color}"><div class="th-name">${mo.name}</div>${sub?`<div class="th-sub">${sub.name}</div>`:''}</th>`;
    } else {
      headerCols+=`<th style="border-bottom:3px solid ${color}"><div class="th-name">${mo.name}</div>${sub?`<div class="th-sub">${sub.name}</div>`:''}</th>`;
    }
  });

  let subHeaderCols='';
  mots.forEach(mo=>{
    if(mo.dualShift){
      subHeaderCols+=`<th class="shift-hdr shift-a"><i class="ti ti-sun"></i> Almoço</th><th class="shift-hdr shift-j"><i class="ti ti-moon"></i> Jantar</th>`;
    } else {
      subHeaderCols+=`<th class="shift-hdr">Turno</th>`;
    }
  });

  html+=`<div class="card p-0">
    <div class="legend-bar">
      <span class="pleg pleg-ok">OK</span>
      <span class="pleg pleg-falta">Falta</span>
      <span class="pleg pleg-form">Formação</span>
      <span class="pleg pleg-backup">Back Up</span>
      <span class="pleg pleg-bext">B.Externo</span>
      <span class="pleg pleg-bint">B.Interno</span>
      <span class="pleg pleg-folga">Folga</span>
    </div>
    <div class="table-wrap"><table class="pres-table">
      <thead>
        <tr>
          <th class="col-color"></th>
          <th class="col-day">Dia</th>
          ${headerCols}
        </tr>
        <tr class="shift-row">
          <td></td><td></td>
          ${subHeaderCols}
        </tr>
      </thead><tbody>`;

  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    const customColor=getRowColor(y,m,d);
    const rowStyle=customColor?`background:${customColor}`:wk?'background:#fefce8':'';
    html+=`<tr style="${rowStyle}">
      <td class="col-color">
        <input type="color" value="${customColor||'#ffffff'}" title="Cor da linha"
          class="color-picker" onchange="window._setRowColor(${y},${m},${d},this.value)">
      </td>
      <td class="col-day ${wk?'weekend-day':''}">
        <span class="day-num">${d}</span>
        <span class="day-name">${DAYS_PT[dow]}</span>
      </td>
      ${mots.map(mo=>{
        if(mo.dualShift){
          const va=getPres(y,m,d,mo.id,'a'),vj=getPres(y,m,d,mo.id,'j');
          return `<td class="${statusPill(va)}" id="pc-${d}-${mo.id}-a">
              <select class="status-sel" onchange="window._updatePres(${y},${m},${d},${mo.id},'a',this)">
                ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===va?'selected':''}>${s||'—'}</option>`).join('')}
              </select></td>
            <td class="${statusPill(vj)}" id="pc-${d}-${mo.id}-j">
              <select class="status-sel" onchange="window._updatePres(${y},${m},${d},${mo.id},'j',this)">
                ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===vj?'selected':''}>${s||'—'}</option>`).join('')}
              </select></td>`;
        }
        const v=getPres(y,m,d,mo.id,'');
        return `<td class="${statusPill(v)}" id="pc-${d}-${mo.id}-">
          <select class="status-sel" onchange="window._updatePres(${y},${m},${d},${mo.id},'',this)">
            ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===v?'selected':''}>${s||'—'}</option>`).join('')}
          </select></td>`;
      }).join('')}
    </tr>`;
  }

  html+=`<tr class="totals-row"><td></td><td class="col-day">Totais</td>
    ${mots.flatMap(mo=>{
      const turnos=mo.dualShift?['a','j']:[''];
      return turnos.map(t=>{
        let ok=0,fal=0,form=0,back=0,bext=0,bint=0,folga=0;
        for(let d=1;d<=days;d++){const v=getPres(y,m,d,mo.id,t);
          if(v==='OK')ok++;else if(v==='Falta')fal++;else if(v==='Formação')form++;
          else if(v==='Back Up')back++;else if(v==='Backup Externo')bext++;else if(v==='Backup Interno')bint++;else if(v==='Folga')folga++;}
        return `<td><div class="totals-cell">${ok?`<span class="tc pleg-ok">${ok}</span>`:''}${fal?`<span class="tc pleg-falta">${fal}</span>`:''}${form?`<span class="tc pleg-form">${form}</span>`:''}${back?`<span class="tc pleg-backup">${back}</span>`:''}${bext?`<span class="tc pleg-bext">${bext}</span>`:''}${bint?`<span class="tc pleg-bint">${bint}</span>`:''}${folga?`<span class="tc pleg-folga">${folga}</span>`:''}</div></td>`;
      });
    }).join('')}
  </tr></tbody></table></div></div>`;
  document.getElementById('content').innerHTML=html;
}
window._presFilterAll=chk=>{if(chk.checked)state.presencaClients=[];renderPresencas();};
window._presFilterToggle=(cid,chk)=>{
  if(chk.checked){if(!state.presencaClients.includes(cid))state.presencaClients.push(cid);}
  else state.presencaClients=state.presencaClients.filter(x=>x!==cid);
  renderPresencas();
};
window._updatePres=(y,m,d,mid,t,sel)=>{

  logAction('Presença alterada',`ID ${mid} | Turno:${t||'único'} | ${d}/${m+1}/${y} | ${old||'—'}→${sel.value||'—'}`);
  const cell=document.getElementById(`pc-${d}-${mid}-${t}`);

};
window._setRowColor=(y,m,d,color)=>{setRowColor(y,m,d,color==='#ffffff'?'':color);logAction('Cor linha',`${d}/${m+1}/${y}→${color}`);};

// ── ENTREGAS ──────────────────────────────────────────────
function renderEntregas(){
  const y=state.year,m=state.month;
  if(!state.selectedClient||!state.clients.find(c=>c.id===state.selectedClient)) state.selectedClient=state.clients[0]?.id||null;
  const client=state.clients.find(c=>c.id===state.selectedClient);

  document.getElementById('page-header').innerHTML=`
    <div class="page-title-area"><h1>Entregas Diárias</h1><p class="page-sub">${MONTHS[m]} ${y}</p></div>
    <div class="header-actions">
      ${monthNavHTML()}
      <button class="btn btn-outline" onclick="window._exportEntExcel()"><i class="ti ti-table-export"></i> Excel</button>
      <button class="btn btn-outline" onclick="window._exportEntPDF()"><i class="ti ti-printer"></i> PDF</button>
    </div>`;

  let pillsHtml=`<div class="client-tabs">
    ${state.clients.map(c=>`<button class="client-tab ${c.id===state.selectedClient?'active':''}"
      style="${c.id===state.selectedClient?`--tab-color:${c.color||'#6366f1'}`:''}"
      onclick="window._selClient(${c.id})">
      <span class="client-dot" style="background:${c.color||'#6366f1'}"></span>${c.name}
    </button>`).join('')}
  </div>`;

  if(!client){document.getElementById('content').innerHTML=pillsHtml+'<div class="empty-state"><i class="ti ti-table"></i><p>Nenhum cliente selecionado.</p></div>';return;}

  const clientColor=client.color||'#6366f1';
  const days=daysInMonth(y,m),fields=client.fields;
  const mots=state.motoristas.filter(mo=>mo.client===client.id&&mo.active!==false);
  const effectiveMots=mots.length>0?mots:[{id:0,name:'—',client:client.id,subcat:null,active:true,dualShift:false}];
  const hasSubs=client.subcategories?.length>0;
  const groups=hasSubs
    ?client.subcategories.map(sub=>({label:sub.name,id:sub.id,mots:effectiveMots.filter(mo=>mo.subcat===sub.id)})).filter(g=>g.mots.length>0)
    :[{label:'',id:null,mots:effectiveMots}];
  if(groups.length===0) groups.push({label:'',id:null,mots:effectiveMots});

  // Build header
  let th1='<th class="col-day-e">Dia</th>';
  let th2='<th></th>';
  if(hasSubs){
    groups.forEach(g=>{
      const cols=g.mots.length*fields.length+(g.mots.length>1?fields.length:0)+(client.showEDR?1:0);
      th1+=`<th colspan="${cols}" style="background:${hexToRgba(clientColor,0.15)};border-bottom:3px solid ${clientColor};text-align:center">${g.label}</th>`;
      g.mots.forEach(mo=>fields.forEach(f=>{th2+=`<th style="font-size:11px"><div style="font-weight:600">${mo.name}</div><div style="opacity:.7">${f}</div></th>`;}));
      if(g.mots.length>1) fields.forEach(f=>{th2+=`<th style="font-size:11px;background:${hexToRgba(clientColor,0.1)}">Sub-total<br>${f}</th>`;});
      if(client.showEDR) th2+=`<th style="font-size:11px;background:${hexToRgba(clientColor,0.1)}">EDR%</th>`;
    });
    fields.forEach(f=>{th1+=`<th style="background:${hexToRgba(clientColor,0.25)};font-size:11px">TOTAL<br>${f}</th>`;});
    if(client.showEDR) th1+=`<th style="background:${hexToRgba(clientColor,0.25)}">EDR%</th>`;
  } else {
    groups.forEach(g=>{
      g.mots.forEach(mo=>fields.forEach(f=>{th1+=`<th style="font-size:11px"><div>${mo.id===0?'':mo.name}</div><div style="opacity:.7;font-weight:400">${f}</div></th>`;}));
      if(g.mots.length>1) fields.forEach(f=>{th1+=`<th style="font-size:11px;background:${hexToRgba(clientColor,0.1)}">Total ${f}</th>`;});
      if(client.showEDR) th1+=`<th style="background:${hexToRgba(clientColor,0.15)}">EDR%</th>`;
    });
  }

  let activeDays=0;
  const gTotsFinal=groups.map(()=>{const t={};fields.forEach(f=>t[f]=0);return t;});
  const gtFinal={};fields.forEach(f=>gtFinal[f]=0);

  let bodyHTML='';
  for(let d=1;d<=days;d++){
    const dow=getDow(y,m,d),wk=dow===0||dow===6;
    const customColor=getRowColor(y,m,d);
    const rowBg=customColor||(wk?'#fefce8':'');
    let rowHasData=false,rowHTML='';
    groups.forEach((g,gi)=>{
      const gTot={};fields.forEach(f=>gTot[f]=0);
      g.mots.forEach(mo=>{
        fields.forEach(f=>{
          const v=getEnt(client.id,y,m,d,mo.id,f);
          if(v>0)rowHasData=true;
          rowHTML+=`<td><input class="num-input" type="number" min="0" value="${v||''}" placeholder="—"
            onchange="window._updateEnt(${client.id},${y},${m},${d},${mo.id},'${encodeF(f)}','${f}',this.value)" /></td>`;
          gTot[f]+=v;gTotsFinal[gi][f]+=v;gtFinal[f]+=v;
        });
      });
      if(g.mots.length>1||hasSubs) fields.forEach(f=>rowHTML+=`<td class="subtotal-cell">${gTot[f]||''}</td>`);
      if(client.showEDR){
        const edr=gTot['Entregas']>0?Math.round(((gTot['Entregues']||0)/gTot['Entregas'])*100):null;
        rowHTML+=`<td>${edrBadge(edr)}</td>`;
      }
    });
    if(hasSubs){
      fields.forEach(f=>{const dayGt=groups.reduce((s,g)=>s+g.mots.reduce((ss,mo)=>ss+getEnt(client.id,y,m,d,mo.id,f),0),0);rowHTML+=`<td class="grand-cell">${dayGt||''}</td>`;});
      if(client.showEDR){
        const dayBase=groups.reduce((s,g)=>s+g.mots.reduce((ss,mo)=>ss+getEnt(client.id,y,m,d,mo.id,'Entregas'),0),0);
        const dayDone=groups.reduce((s,g)=>s+g.mots.reduce((ss,mo)=>ss+getEnt(client.id,y,m,d,mo.id,'Entregues'),0),0);
        rowHTML+=`<td>${edrBadge(dayBase>0?Math.round((dayDone/dayBase)*100):null)}</td>`;
      }
    }
    if(rowHasData) activeDays++;
    bodyHTML+=`<tr style="${rowBg?`background:${rowBg}`:''}">
      <td class="col-day-e ${wk?'weekend-day':''}"><span class="day-num">${d}</span><span class="day-name">${DAYS_PT[dow]}</span></td>
      ${rowHTML}
    </tr>`;
  }

  // Totals row
  let totHTML='<td class="col-day-e total-lbl">Total</td>';
  groups.forEach((g,gi)=>{
    g.mots.forEach(mo=>{
      fields.forEach(f=>{let s=0;for(let d=1;d<=days;d++)s+=getEnt(client.id,y,m,d,mo.id,f);totHTML+=`<td class="total-cell">${s.toLocaleString()}</td>`;});
    });
    if(g.mots.length>1||hasSubs) fields.forEach(f=>totHTML+=`<td class="subtotal-cell total-cell">${gTotsFinal[gi][f].toLocaleString()}</td>`);
    if(client.showEDR){const e=gTotsFinal[gi]['Entregas']>0?Math.round(((gTotsFinal[gi]['Entregues']||0)/gTotsFinal[gi]['Entregas'])*100):null;totHTML+=`<td>${edrBadge(e)}</td>`;}
  });
  if(hasSubs){fields.forEach(f=>totHTML+=`<td class="grand-cell total-cell">${gtFinal[f].toLocaleString()}</td>`);if(client.showEDR){const e=gtFinal['Entregas']>0?Math.round(((gtFinal['Entregues']||0)/gtFinal['Entregas'])*100):null;totHTML+=`<td>${edrBadge(e)}</td>`;}}

  // Media row
  let medHTML=`<td class="col-day-e total-lbl" style="opacity:.6;font-size:11px">Média<br>(${activeDays}d)</td>`;
  groups.forEach((g,gi)=>{
    g.mots.forEach(mo=>{
      fields.forEach(f=>{let s=0;for(let d=1;d<=days;d++)s+=getEnt(client.id,y,m,d,mo.id,f);medHTML+=`<td class="media-cell">${activeDays>0?Math.round(s/activeDays):0}</td>`;});
    });
    if(g.mots.length>1||hasSubs) fields.forEach(f=>medHTML+=`<td class="subtotal-cell media-cell">${activeDays>0?Math.round(gTotsFinal[gi][f]/activeDays):0}</td>`);
    if(client.showEDR) medHTML+=`<td></td>`;
  });
  if(hasSubs){fields.forEach(f=>medHTML+=`<td class="grand-cell media-cell">${activeDays>0?Math.round(gtFinal[f]/activeDays):0}</td>`);if(client.showEDR)medHTML+=`<td></td>`;}

  document.getElementById('content').innerHTML=pillsHtml+`
    <div class="card p-0" style="border-top:3px solid ${clientColor}">
      <div class="ent-header" style="background:${hexToRgba(clientColor,0.08)}">
        <div>
          <span class="client-dot lg" style="background:${clientColor}"></span>
          <strong>${client.name}</strong>
          <span class="muted">${MONTHS[m]} ${y}</span>
        </div>
        <span class="muted">${effectiveMots.filter(m=>m.id!==0).map(m=>m.name).join(' · ')}</span>
      </div>
      <div class="table-wrap"><table class="ent-table">
        <thead>
          <tr>${th1}</tr>
          ${hasSubs?`<tr class="th2-row">${th2}</tr>`:''}
        </thead>
        <tbody>
          ${bodyHTML}
          <tr class="totals-row">${totHTML}</tr>
          <tr class="media-row">${medHTML}</tr>
        </tbody>
      </table></div>
    </div>`;
}
window._selClient=id=>{state.selectedClient=id;renderEntregas();};
window._updateEnt=(cid,y,m,d,mid,fKey,fLabel,val)=>{
  const old=getEnt(cid,y,m,d,mid,fLabel);
  setEnt(cid,y,m,d,mid,fLabel,val);
  const client=state.clients.find(c=>c.id===cid);
  logAction('Entrega editada',`${client?.name} | ID${mid} | ${fLabel} | ${d}/${m+1}/${y} | ${old}→${val}`);
  renderEntregas();
};

window._addSub=()=>{
  const list=document.getElementById('subs-list');
  const div=document.createElement('div');div.style.cssText='display:flex;gap:8px;align-items:center';
  div.innerHTML=`<input class="sub-input" placeholder="Nome da loja…" style="flex:1"/><button class="icon-btn danger" onclick="this.parentElement.remove()"><i class="ti ti-x"></i></button>`;
  list.appendChild(div);
};
window._addCustomField=()=>{
  const v=document.getElementById('custom-field').value.trim();if(!v)return;
  document.getElementById('extra-fields').innerHTML+=`<label class="check-label" style="margin-top:6px"><input type="checkbox" value="${v}" checked> ${v}</label>`;
  document.getElementById('custom-field').value='';
};
window._saveClient=async id=>{
  const name=document.getElementById('c-name').value.trim();
  const location=document.getElementById('c-loc').value.trim();
  const color=document.getElementById('c-color').value;
  const showEDR=document.getElementById('c-edr').value==='true';
  const fields=[...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(i=>i.value);
  if(!name)return alert('Nome obrigatório');if(!fields.length)return alert('Selecione pelo menos um campo');
  const existingC=id?state.clients.find(x=>x.id===id):null;
  const existingSubs=existingC?.subcategories||[];
  const subcategories=[...document.querySelectorAll('.sub-input')].map((inp,i)=>{
    const nm=inp.value.trim();if(!nm)return null;
    return {id:existingSubs[i]?.id||`${id||'new'}-${i}-${Date.now()}`,name:nm};
  }).filter(Boolean);
  if(id){const c=state.clients.find(x=>x.id===id);Object.assign(c,{name,location,color,showEDR,fields,subcategories});logAction('Cliente editado',name);}
  else{state.clients.push({id:nextId(state.clients),name,location,color,showEDR,fields,subcategories});logAction('Cliente criado',name);}
  await saveConfig();window._closeModal();renderClientes();
};
window._delClient=async id=>{
  if(!confirm('Tem certeza?'))return;
  const c=state.clients.find(x=>x.id===id);logAction('Cliente removido',c?.name||'');
  state.clients=state.clients.filter(c=>c.id!==id);await saveConfig();renderClientes();
};

function _buildSubcatOptions(cid,sel){
  if(!cid) return '<option value="">—</option>';
  const c=state.clients.find(x=>x.id===Number(cid));
  if(!c?.subcategories?.length) return '<option value="">— Sem subcategoria —</option>';
  return '<option value="">— Sem subcategoria —</option>'+c.subcategories.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.name}</option>`).join('');
}

function dateRange(s,e){const start=new Date(s),end=new Date(e),res=[];const cur=new Date(start);while(cur<=end){res.push({y:cur.getFullYear(),m:cur.getMonth(),d:cur.getDate()});cur.setDate(cur.getDate()+1);}return res;}
async function ensureMonth(y,m){const mk=`${y}-${String(m+1).padStart(2,'0')}`;const p=await fbGet(`presencas/${mk}`);if(p)state.presencas={...state.presencas,...p};const e=await fbGet(`entregas/${mk}`);if(e)state.entregas={...state.entregas,...e};}

window._exportExcelPeriod=async()=>{
  const type=document.getElementById('rep-type').value,clientId=document.getElementById('rep-client').value;
  const ss=document.getElementById('rep-start').value,es=document.getElementById('rep-end').value;
  if(!ss||!es)return alert('Selecione datas');
  const days=dateRange(ss,es);
  for(const mk of [...new Set(days.map(x=>`${x.y}-${x.m}`))].map(s=>s.split('-').map(Number))){await ensureMonth(mk[0],mk[1]);}
  const wb=XLSX.utils.book_new();
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  if(type==='presencas'){
    const mots=state.motoristas.filter(m=>m.active!==false);
    const headers=['Data','Dia'];mots.forEach(mo=>{if(mo.dualShift){headers.push(mo.name+' (Almoço)',mo.name+' (Jantar)');}else{headers.push(mo.name);}});
    const rows=[headers];
    days.forEach(({y,m,d})=>{const row=[`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)]];mots.forEach(mo=>{if(mo.dualShift){row.push(getPres(y,m,d,mo.id,'a')||'',getPres(y,m,d,mo.id,'j')||'');}else{row.push(getPres(y,m,d,mo.id,'')||'');}});rows.push(row);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Presenças');
  } else {
    clients.forEach(c=>{
      const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false);
      const eff=mots.length>0?mots:[{id:0,name:'—'}];
      const headers=['Data','Dia'];eff.forEach(mo=>c.fields.forEach(f=>headers.push(`${mo.id===0?'':mo.name+' - '}${f}`)));
      const rows=[headers];
      days.forEach(({y,m,d})=>{const row=[`${d}/${m+1}/${y}`,DAYS_PT[getDow(y,m,d)]];eff.forEach(mo=>c.fields.forEach(f=>row.push(getEnt(c.id,y,m,d,mo.id,f)||'')));rows.push(row);});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.name.substring(0,31));
    });
  }
  XLSX.writeFile(wb,`relatorio_${ss}_${es}.xlsx`);
  logAction('Excel exportado',`${type} | ${ss} a ${es}`);
};
window._exportPDFPeriod=async()=>{
  const type=document.getElementById('rep-type').value,clientId=document.getElementById('rep-client').value;
  const ss=document.getElementById('rep-start').value,es=document.getElementById('rep-end').value;
  if(!ss||!es)return alert('Selecione datas');
  const days=dateRange(ss,es);
  for(const mk of [...new Set(days.map(x=>`${x.y}-${x.m}`))].map(s=>s.split('-').map(Number))){await ensureMonth(mk[0],mk[1]);}
  const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
  let html=`<html><head><style>body{font-family:Inter,Arial;font-size:9px;padding:14px;color:#1e293b}h2{font-size:14px;margin-bottom:4px}p{color:#64748b;margin-bottom:12px}h3{font-size:11px;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid #e2e8f0}table{width:100%;border-collapse:collapse;margin-bottom:14px}th{background:#f8fafc;padding:5px 6px;text-align:left;font-size:9px;border-bottom:2px solid #e2e8f0}td{padding:4px 6px;border-bottom:1px solid #f1f5f9}tr:nth-child(even)td{background:#fafafa}.tot td{background:#eff6ff!important;font-weight:600}.eok{color:#059669;font-weight:600}.ewarn{color:#d97706;font-weight:600}.ebad{color:#dc2626;font-weight:600}</style></head><body>
  <h2>TrafficLogistics DE</h2><p>${ss} → ${es}</p>`;
  if(type==='presencas'){
    const mots=state.motoristas.filter(m=>m.active!==false);
    html+=`<table><thead><tr><th>Data</th>${mots.flatMap(mo=>mo.dualShift?[`<th>${mo.name} 🌅</th>`,`<th>${mo.name} 🌙</th>`]:[`<th>${mo.name}</th>`]).join('')}</tr></thead><tbody>`;
    days.forEach(({y,m,d})=>{html+=`<tr><td>${d}/${m+1}/${y}</td>${mots.flatMap(mo=>mo.dualShift?[`<td>${getPres(y,m,d,mo.id,'a')||'—'}</td>`,`<td>${getPres(y,m,d,mo.id,'j')||'—'}</td>`]:[`<td>${getPres(y,m,d,mo.id,'')||'—'}</td>`]).join('')}</tr>`;});
    html+=`</tbody></table>`;
  } else {
    clients.forEach(c=>{
      const mots=state.motoristas.filter(mo=>mo.client===c.id&&mo.active!==false);
      const eff=mots.length>0?mots:[{id:0,name:'—'}];
      html+=`<h3>${c.name}</h3><table><thead><tr><th>Data</th>${eff.flatMap(mo=>c.fields.map(f=>`<th>${mo.id===0?'':mo.name+' '}<small>${f}</small></th>`)).join('')}</tr></thead><tbody>`;
      days.forEach(({y,m,d})=>{
        const vals=eff.flatMap(mo=>c.fields.map(f=>getEnt(c.id,y,m,d,mo.id,f)));
        if(vals.every(v=>v===0))return;
        html+=`<tr><td>${d}/${m+1}/${y}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}</tr>`;
      });
      html+=`</tbody></table>`;
    });
  }
  html+=`</body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
};

window._exportPresPDF=()=>{

  const mots=state.presencaClients.length>0?state.motoristas.filter(mo=>state.presencaClients.includes(mo.client)&&mo.active!==false):state.motoristas.filter(mo=>mo.active!==false);
  let html=`<html><head><style>body{font-family:Inter,Arial;font-size:8px;padding:12px}h2{font-size:13px;margin-bottom:8px}table{width:100%;border-collapse:collapse}th{background:#f8fafc;padding:4px 5px;border-bottom:2px solid #e2e8f0;font-size:8px}td{padding:3px 5px;border-bottom:1px solid #f1f5f9;text-align:center}.wi{background:#fefce8}</style></head><body>

  for(let d=1;d<=days;d++){const dow=getDow(y,m,d),wk=dow===0||dow===6;html+=`<tr class="${wk?'wi':''}"><td>${d}</td><td>${DAYS_PT[dow]}</td>${mots.flatMap(mo=>mo.dualShift?[`<td>${getPres(y,m,d,mo.id,'a')||'—'}</td>`,`<td>${getPres(y,m,d,mo.id,'j')||'—'}</td>`]:[`<td>${getPres(y,m,d,mo.id,'')||'—'}</td>`]).join('')}</tr>`;}
  html+=`</tbody></table></body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();

window._exportEntExcel=()=>{
  const client=state.clients.find(c=>c.id===state.selectedClient);if(!client)return;

window._exportEntPDF=()=>{
  const client=state.clients.find(c=>c.id===state.selectedClient);if(!client)return;
  const y=state.year,m=state.month,days=daysInMonth(y,m);
  const mots=state.motoristas.filter(mo=>mo.client===client.id&&mo.active!==false);
  const eff=mots.length>0?mots:[{id:0,name:'—'}];
  let html=`<html><head><style>body{font-family:Inter,Arial;font-size:8px;padding:12px}h2{font-size:13px;margin-bottom:8px}table{width:100%;border-collapse:collapse}th{background:#f8fafc;padding:4px 5px;border-bottom:2px solid ${client.color||'#6366f1'};font-size:8px}td{padding:3px 5px;border-bottom:1px solid #f1f5f9;text-align:center}.wi{background:#fefce8}.tot td{background:#eff6ff!important;font-weight:600}</style></head><body>
  <h2>${client.name} — ${MONTHS[m]} ${y}</h2><table><thead><tr><th>Dia</th>${eff.flatMap(mo=>client.fields.map(f=>`<th>${mo.id===0?'':mo.name+' '}${f}</th>`)).join('')}</tr></thead><tbody>`;
  const tots={};client.fields.forEach(f=>tots[f]=0);
  for(let d=1;d<=days;d++){const dow=getDow(y,m,d),wk=dow===0||dow===6;const vals=eff.flatMap(mo=>client.fields.map(f=>{const v=getEnt(client.id,y,m,d,mo.id,f);tots[f]+=v;return v;}));if(vals.every(v=>v===0)&&!wk)continue;html+=`<tr class="${wk?'wi':''}"><td>${d} ${DAYS_PT[dow]}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}</tr>`;}
  html+=`<tr class="tot"><td>TOTAL</td>${eff.flatMap(mo=>client.fields.map(f=>`<td>${tots[f]}</td>`)).join('')}</tr>`;
  html+=`</tbody></table></body></html>`;const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
};

// ── HISTÓRICO ─────────────────────────────────────────────
async function renderHistorico(){
  document.getElementById('page-header').innerHTML=`<div class="page-title-area"><h1>Histórico de edições</h1></div>`;
  document.getElementById('content').innerHTML='<div class="loading-state"><i class="ti ti-loader-2 spin"></i><p>A carregar histórico…</p></div>';
  try{
    const q=query(collection(db,'audit_log'),orderBy('ts','desc'),limit(300));
    const snap=await getDocs(q);const logs=[];snap.forEach(d=>logs.push(d.data()));
    document.getElementById('content').innerHTML=`<div class="card p-0">
      <div class="card-header"><h3>Últimas ${logs.length} ações</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Data/Hora</th><th>Utilizador</th><th>Ação</th><th>Detalhes</th></tr></thead>
        <tbody>${logs.map(l=>{const dt=new Date(l.ts);
          return `<tr><td class="muted" style="white-space:nowrap;font-size:12px">${dt.toLocaleDateString('pt-PT')} ${dt.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</td>
          <td><strong style="font-size:13px">${l.user}</strong></td>
          <td><span class="badge badge-info">${l.action}</span></td>
          <td class="muted" style="font-size:12px">${l.details}</td></tr>`;
        }).join('')||'<tr><td colspan="4" style="text-align:center;padding:40px;color:#94a3b8">Sem registos ainda.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  }catch(e){document.getElementById('content').innerHTML='<div class="empty-state"><i class="ti ti-alert-circle" style="color:#ef4444"></i><p>Erro ao carregar histórico.</p></div>';}
}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid transparent;}
.btn-primary{background:#6366f1;color:#fff;border-color:#6366f1;}.btn-primary:hover{background:#4f46e5;border-color:#4f46e5;}
.btn-outline{background:#fff;color:#374151;border-color:#d1d5db;}.btn-outline:hover{background:#f9fafb;border-color:#9ca3af;}
.btn-ghost{background:transparent;color:#6366f1;border-color:transparent;}.btn-ghost:hover{background:#eff6ff;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:#f1f5f9;border-color:#cbd5e1;color:#374151;}
.icon-btn.danger:hover{background:#fef2f2;border-color:#fecaca;color:#dc2626;}
.select-input{padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:13px;background:#fff;color:#374151;cursor:pointer;}
.select-input:focus{outline:none;border-color:#6366f1;}

/* ── MONTH NAV ─────────────────────────────── */
.month-nav{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:4px 6px;}
.month-nav .icon-btn{border:none;background:transparent;width:28px;height:28px;}
.month-nav .icon-btn:hover{background:#e2e8f0;}
.month-label{font-weight:600;font-size:13px;color:#374151;min-width:120px;text-align:center;}

/* ── CARDS ─────────────────────────────────── */
.card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:20px;margin-bottom:20px;}
.card.p-0{padding:0;}
.card-header{padding:16px 20px;border-bottom:1px solid #f1f5f9;}
.card-header h3{font-size:14px;font-weight:600;color:#1e293b;}

/* ── KPI GRID ──────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px;display:flex;align-items:center;gap:14px;}
.kpi-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.kpi-label{font-size:12px;color:#94a3b8;margin-bottom:4px;}
.kpi-value{font-size:22px;font-weight:700;color:#0f172a;line-height:1;}

/* ── TABLES ─────────────────────────────────── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:10px 14px;text-align:left;font-weight:500;font-size:12px;color:#64748b;border-bottom:1.5px solid #e2e8f0;white-space:nowrap;background:#fff;}
td{padding:9px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafbfc;}
.sub-row td{background:#fafafa;}
.parent-row td{background:#f8fafc;}

/* ── BADGES & CHIPS ─────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-success{background:#d1fae5;color:#065f46;}
.badge-danger{background:#fee2e2;color:#991b1b;}
.badge-warning{background:#fef3c7;color:#92400e;}
.badge-info{background:#dbeafe;color:#1e40af;}
.badge-muted{background:#f1f5f9;color:#64748b;}
.chip{display:inline-flex;padding:2px 8px;background:#f1f5f9;border-radius:6px;font-size:11px;color:#475569;margin:1px;}
.chip-total{background:#e0e7ff;color:#3730a3;}
.client-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;}
.client-dot.lg{width:12px;height:12px;margin-right:8px;}

/* ── PRESENCE TABLE ─────────────────────────── */
.legend-bar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #f1f5f9;background:#fafbfc;}
.pleg{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.pleg-ok{background:#d1fae5;color:#065f46;}
.pleg-falta{background:#fee2e2;color:#991b1b;}
.pleg-form{background:#dbeafe;color:#1e40af;}
.pleg-backup{background:#fef3c7;color:#92400e;}
.pleg-bext{background:#ede9fe;color:#5b21b6;}
.pleg-bint{background:#ffedd5;color:#9a3412;}
.pleg-folga{background:#cffafe;color:#155e75;}
.pres-table th,.pres-table td{border:1px solid #f1f5f9;padding:4px 6px;text-align:center;font-size:12px;white-space:nowrap;}
.pres-table th{background:#f8fafc;}
.col-color{width:36px;background:#f8fafc!important;}
.col-day{min-width:90px;background:#f8fafc!important;}
.col-day-e{min-width:80px;}
.day-num{font-weight:600;font-size:13px;display:block;}
.day-name{font-size:10px;color:#94a3b8;display:block;}
.weekend-day{color:#94a3b8;}
.th-name{font-weight:600;font-size:12px;}
.th-sub{font-size:10px;opacity:.7;font-weight:400;}
.shift-hdr{font-size:10px!important;font-weight:500!important;color:#94a3b8!important;background:#fafafa!important;}
.shift-a{color:#065f46!important;background:#f0fdf4!important;}
.shift-j{color:#1e40af!important;background:#eff6ff!important;}
.shift-row td,.shift-row th{background:#fafafa!important;}
.status-sel{border:none;background:transparent;font-size:11px;width:85px;cursor:pointer;font-weight:500;}
.pill-ok{background:#d1fae5!important;color:#065f46;}
.pill-falta{background:#fee2e2!important;color:#991b1b;}
.pill-form{background:#dbeafe!important;color:#1e40af;}
.pill-backup{background:#fef3c7!important;color:#92400e;}
.pill-bext{background:#ede9fe!important;color:#5b21b6;}
.pill-bint{background:#ffedd5!important;color:#9a3412;}
.pill-folga{background:#cffafe!important;color:#155e75;}
.pill-empty{background:#f8fafc!important;color:#94a3b8;}
.totals-row td{background:#f8fafc!important;font-weight:600;border-top:2px solid #e2e8f0;}
.totals-cell{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.tc{padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600;}
.color-picker{width:24px;height:24px;border:1.5px solid #e2e8f0;border-radius:6px;cursor:pointer;padding:1px;}

/* ── ENTREGAS TABLE ─────────────────────────── */
.client-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.client-tab{display:flex;align-items:center;padding:7px 16px;border-radius:9px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;font-weight:500;color:#64748b;cursor:pointer;transition:all .15s;}
.client-tab:hover{border-color:#c7d2fe;color:#4f46e5;}
.client-tab.active{border-color:var(--tab-color,#6366f1);background:color-mix(in srgb,var(--tab-color,#6366f1) 8%,white);color:var(--tab-color,#6366f1);}
.ent-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f1f5f9;}
.ent-table th,.ent-table td{border:1px solid #f1f5f9;padding:6px 8px;text-align:center;font-size:12px;white-space:nowrap;}
.ent-table th{background:#f8fafc!important;}
.th2-row th{background:#f8fafc!important;font-size:11px!important;}
.num-input{width:56px;border:1px solid transparent;background:transparent;text-align:center;padding:3px;font-size:12px;border-radius:6px;color:#1e293b;}
.num-input:focus{border-color:#6366f1;outline:none;background:#fff;}
.subtotal-cell{background:#f8fafc!important;font-weight:600;color:#374151;}
.grand-cell{background:#eff6ff!important;font-weight:700;color:#1e40af;}
.total-lbl{font-weight:700;color:#1e293b;text-align:left!important;}
.total-cell{font-weight:700!important;background:#f8fafc!important;}
.media-row td{font-size:11px;color:#94a3b8;font-style:italic;background:#fafbfc!important;}
.media-cell{font-weight:500!important;}

/* ── FORMS ──────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:12px;font-weight:500;color:#374151;}
.form-group input,.form-group select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:13px;color:#1e293b;background:#fff;transition:border .15s;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#6366f1;}
.fields-check{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.check-label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:#374151;}
.filter-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.filter-label{font-size:12px;font-weight:500;color:#64748b;display:flex;align-items:center;gap:6px;}
.filter-check{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:#374151;}

/* ── MODAL ──────────────────────────────────── */
#modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px);}
#modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:18px;padding:28px;width:620px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.2);transform:translateY(8px);transition:transform .2s;}
#modal-overlay.open .modal{transform:translateY(0);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.modal-title{font-size:16px;font-weight:600;color:#0f172a;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid #f1f5f9;}

/* ── STATES ─────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
.empty-state i{font-size:40px;margin-bottom:12px;display:block;}
.empty-state p{font-size:14px;}
.loading-state{text-align:center;padding:60px 20px;color:#94a3b8;}
.loading-state i{font-size:32px;margin-bottom:12px;display:block;}
.loading-state p{font-size:14px;}
.muted{color:#94a3b8;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo"><i class="ti ti-truck-delivery"></i></div>
    <h2>TrafficLogistics DE</h2>
    <p>Inicia sessão para continuar</p>
    <input type="email" id="login-email" placeholder="Email"/>
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')window._doLogin()"/>
    <button id="login-btn" onclick="window._doLogin()">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="ti ti-truck-delivery"></i></div>
      <div class="logo-text">TrafficLogistics<small>DE Platform</small></div>
    </div>
    <div class="nav-section-label">Principal</div>
    <a class="nav-link active" data-page="dashboard" onclick="window._showPage('dashboard')"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
    <a class="nav-link" data-page="presencas" onclick="window._showPage('presencas')"><i class="ti ti-calendar-check"></i> Presenças</a>
    <div class="nav-section-label">Lançamentos</div>
    <a class="nav-link" data-page="entregas" onclick="window._showPage('entregas')"><i class="ti ti-package"></i> Entregas Diárias</a>
    <div class="nav-section-label">Cadastros</div>
    <a class="nav-link" data-page="clientes" onclick="window._showPage('clientes')"><i class="ti ti-building-store"></i> Clientes</a>
    <a class="nav-link" data-page="motoristas" onclick="window._showPage('motoristas')"><i class="ti ti-users"></i> Motoristas</a>
    <div class="nav-section-label">Dados</div>
    <a class="nav-link" data-page="relatorios" onclick="window._showPage('relatorios')"><i class="ti ti-file-analytics"></i> Relatórios</a>
    <a class="nav-link" data-page="historico" onclick="window._showPage('historico')"><i class="ti ti-history"></i> Histórico</a>
    <div class="sidebar-footer">
      <div id="user-info"></div>
      <button class="logout-btn" onclick="window._doLogout()"><i class="ti ti-logout"></i> Sair</button>
    </div>
  </nav>

  <div id="main">
    <div id="page-header"></div>
    <div id="content"><div class="loading-state"><i class="ti ti-loader-2 spin"></i><p>A carregar…</p></div></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="icon-btn" onclick="window._closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

</body>
</html>
