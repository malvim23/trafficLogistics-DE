<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficLogistics DE</title>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // =====================================================
  // ⚠️ SUBSTITUI AQUI com a tua configuração do Firebase
  // =====================================================
  const firebaseConfig = {
    apiKey: "COLOCA_AQUI",
    authDomain: "COLOCA_AQUI",
    projectId: "COLOCA_AQUI",
    storageBucket: "COLOCA_AQUI",
    messagingSenderId: "COLOCA_AQUI",
    appId: "COLOCA_AQUI"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // =====================================================
  // STATE
  // =====================================================
  const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DAYS_PT = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const STATUS_OPTIONS = ['','OK','Falta','Formação','Back Up','Backup Externo','Backup Interno'];
  const ALL_FIELDS = ['Entregues','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados','Entregas DHL','Saldo','Tentativas','Devoluções'];

  let state = {
    page: 'dashboard',
    month: new Date().getMonth(),
    year: new Date().getFullYear(),
    selectedClient: null,
    dashboardClient: 'all',
    presencaClient: 'all',
    clients: [],
    motoristas: [],
    presencas: {},
    entregas: {},
    loaded: false
  };

  let unsubListeners = [];

  // =====================================================
  // FIREBASE HELPERS
  // =====================================================
  async function fbSet(docPath, data) {
    try { await setDoc(doc(db, docPath), data, { merge: true }); } catch(e) { console.error(e); }
  }

  async function fbGet(docPath) {
    try { const d = await getDoc(doc(db, docPath)); return d.exists() ? d.data() : null; } catch(e) { return null; }
  }

  function fbListen(docPath, cb) {
    return onSnapshot(doc(db, docPath), snap => { if(snap.exists()) cb(snap.data()); });
  }

  async function loadAllData() {
    // Load config (clients + motoristas)
    const cfg = await fbGet('config/main');
    if(cfg) {
      state.clients = cfg.clients || [];
      state.motoristas = cfg.motoristas || [];
      if(state.clients.length && !state.selectedClient) state.selectedClient = state.clients[0].id;
    } else {
      // Default clients if first time
      state.clients = [
        { id: 1, name: 'Telheiras', location: 'Lisboa', fields: ['Entregues','Não entregues','CA','CCU','Fora de rota','Cliente não aceitou','MD','IA (Imp. Acesso)','Reagendado','Anulados'] },
        { id: 2, name: 'Vila Real', location: 'Vila Real', fields: ['Entregas DHL','Entregues','Saldo'] }
      ];
      state.motoristas = [
        { id: 1, name: 'Rodrigo', client: 1, contact: '' },
        { id: 2, name: 'João Silva', client: 1, contact: '' },
        { id: 3, name: 'Carlos Mendes', client: 2, contact: '' }
      ];
      await saveConfig();
    }

    // Load presencas for current month
    await loadMonthData();
    state.loaded = true;
    showPage(state.page);

    // Realtime listener for presence + deliveries (current month)
    setupListeners();
  }

  function monthKey() { return `${state.year}-${String(state.month+1).padStart(2,'0')}`; }

  async function loadMonthData() {
    const mk = monthKey();
    const p = await fbGet(`presencas/${mk}`);
    if(p) state.presencas = { ...state.presencas, ...p };
    const e = await fbGet(`entregas/${mk}`);
    if(e) state.entregas = { ...state.entregas, ...e };
  }

  function setupListeners() {
    unsubListeners.forEach(u => u());
    unsubListeners = [];
    const mk = monthKey();
    unsubListeners.push(
      fbListen(`presencas/${mk}`, data => { state.presencas = { ...state.presencas, ...data }; if(state.page==='presencas') renderPresencas(); if(state.page==='dashboard') renderDashboard(); }),
      fbListen(`entregas/${mk}`, data => { state.entregas = { ...state.entregas, ...data }; if(state.page==='entregas') renderEntregas(); if(state.page==='dashboard') renderDashboard(); }),
      fbListen('config/main', data => {
        if(data.clients) state.clients = data.clients;
        if(data.motoristas) state.motoristas = data.motoristas;
        if(['clientes','motoristas','dashboard'].includes(state.page)) showPage(state.page);
      })
    );
  }

  async function saveConfig() {
    await fbSet('config/main', { clients: state.clients, motoristas: state.motoristas });
  }

  async function savePresencas() {
    const mk = monthKey();
    const toSave = {};
    Object.keys(state.presencas).forEach(k => { if(k.startsWith(`${state.year}-${state.month}-`)) toSave[k] = state.presencas[k]; });
    await fbSet(`presencas/${mk}`, state.presencas);
  }

  async function saveEntregas() {
    await fbSet(`entregas/${monthKey()}`, state.entregas);
  }

  // =====================================================
  // HELPERS
  // =====================================================
  function daysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }
  function getDow(y,m,d) { return new Date(y,m,d).getDay(); }
  function nextId(arr) { return arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1; }

  function getPresence(y,m,d,mid) { return state.presencas[`${y}-${m}-${d}-${mid}`]||''; }
  function setPresence(y,m,d,mid,v) { state.presencas[`${y}-${m}-${d}-${mid}`]=v; savePresencas(); }
  function getEntrega(cid,y,m,d,f) { return Number(state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`])||0; }
  function setEntrega(cid,y,m,d,f,v) { state.entregas[`${cid}-${y}-${m}-${d}-${encodeF(f)}`]=Number(v)||0; saveEntregas(); }
  function encodeF(f) { return f.replace(/[^a-zA-Z0-9]/g,'_'); }

  function edrClass(v) { if(v===null||v===undefined) return ''; return v>=95?'edr-high':v>=80?'edr-mid':'edr-low'; }
  function statusClass(v) {
    if(v==='OK') return 'status-ok';
    if(v==='Falta') return 'status-falta';
    if(v==='Formação') return 'status-formacao';
    if(v==='Back Up') return 'status-backup';
    if(v==='Backup Externo') return 'status-bext';
    if(v==='Backup Interno') return 'status-bint';
    return 'status-empty';
  }

  function changeMonth(d) {
    state.month += d;
    if(state.month<0){state.month=11;state.year--;}
    if(state.month>11){state.month=0;state.year++;}
    loadMonthData().then(()=>{ setupListeners(); showPage(state.page); });
  }

  function monthNav() {
    return `<div class="month-nav">
      <button onclick="window._changeMonth(-1)">◀</button>
      <span>${MONTHS[state.month]} ${state.year}</span>
      <button onclick="window._changeMonth(1)">▶</button>
    </div>`;
  }

  // =====================================================
  // ROUTER
  // =====================================================
  window._showPage = function(page) {
    state.page = page;
    document.querySelectorAll('.nav-item').forEach(el =>
      el.classList.toggle('active', el.getAttribute('onclick')?.includes(`'${page}'`))
    );
    const titles = { dashboard:'Dashboard', presencas:'Presenças', entregas:'Entregas Diárias', clientes:'Clientes', motoristas:'Motoristas', relatorios:'Relatórios' };
    document.getElementById('page-title').textContent = titles[page]||page;
    if(!state.loaded) { document.getElementById('content').innerHTML = '<div style="padding:40px;text-align:center;color:#666">A carregar dados...</div>'; return; }
    ({ dashboard:renderDashboard, presencas:renderPresencas, entregas:renderEntregas, clientes:renderClientes, motoristas:renderMotoristas, relatorios:renderRelatorios })[page]?.();
  };
  function showPage(p) { window._showPage(p); }
  window._changeMonth = changeMonth;

  // =====================================================
  // DASHBOARD
  // =====================================================
  function renderDashboard() {
    const y=state.year, m=state.month, days=daysInMonth(y,m), today=new Date().getDate();
    const filterCid = state.dashboardClient==='all'?null:Number(state.dashboardClient);
    const clients = filterCid?state.clients.filter(c=>c.id===filterCid):state.clients;

    let totalEnt=0,totalNao=0;
    clients.forEach(c=>{
      for(let d=1;d<=days;d++){
        totalEnt+=getEntrega(c.id,y,m,d,c.fields[0]);
        if(c.fields[1]) totalNao+=getEntrega(c.id,y,m,d,c.fields[1]);
      }
    });
    const totalG=totalEnt+totalNao, edrG=totalG>0?Math.round((totalEnt/totalG)*100):0;
    const motsFilt=filterCid?state.motoristas.filter(mo=>mo.client===filterCid):state.motoristas;
    let faltasHoje=0; motsFilt.forEach(mo=>{if(getPresence(y,m,today,mo.id)==='Falta')faltasHoje++;});

    document.getElementById('topbar-actions').innerHTML = `${monthNav()}
      <select onchange="window._dashFilter(this.value)" style="padding:6px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px">
        <option value="all" ${state.dashboardClient==='all'?'selected':''}>Todos os clientes</option>
        ${state.clients.map(c=>`<option value="${c.id}" ${state.dashboardClient==c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>`;

    document.getElementById('content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card blue"><div class="label">Total Entregues</div><div class="value">${totalEnt.toLocaleString()}</div></div>
        <div class="stat-card red"><div class="label">Não Entregues</div><div class="value">${totalNao.toLocaleString()}</div></div>
        <div class="stat-card green"><div class="label">EDR Geral</div><div class="value">${edrG}%</div></div>
        <div class="stat-card orange"><div class="label">Faltas Hoje</div><div class="value">${faltasHoje}</div></div>
        <div class="stat-card blue"><div class="label">Clientes</div><div class="value">${clients.length}</div></div>
        <div class="stat-card"><div class="label">Motoristas</div><div class="value">${motsFilt.length}</div></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Resumo por Cliente — ${MONTHS[m]} ${y}</span></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Cliente</th><th>Entregues</th><th>Não Entregues</th><th>Total</th><th>EDR%</th><th>Motoristas</th></tr></thead>
          <tbody>${clients.map(c=>{
            let ent=0,nao=0;
            for(let d=1;d<=days;d++){ ent+=getEntrega(c.id,y,m,d,c.fields[0]); if(c.fields[1]) nao+=getEntrega(c.id,y,m,d,c.fields[1]); }
            const tot=ent+nao, edr=tot>0?Math.round((ent/tot)*100):null;
            const mots=state.motoristas.filter(mo=>mo.client===c.id).map(mo=>mo.name).join(', ');
            return `<tr><td><strong>${c.name}</strong><br><small style="color:#5f6368">${c.location}</small></td>
              <td>${ent.toLocaleString()}</td><td>${nao.toLocaleString()}</td><td>${tot.toLocaleString()}</td>
              <td class="edr-cell ${edrClass(edr)}">${edr!==null?edr+'%':'—'}</td><td>${mots||'—'}</td></tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Atalhos Rápidos</span></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="window._showPage('presencas')">✅ Registar Presença</button>
          <button class="btn btn-primary" onclick="window._showPage('entregas')">📦 Lançar Entregas</button>
          <button class="btn btn-outline" onclick="window._showPage('relatorios')">📄 Ver Relatórios</button>
        </div>
      </div>`;
  }
  window._dashFilter = v => { state.dashboardClient=v; renderDashboard(); };

  // =====================================================
  // PRESENÇAS
  // =====================================================
  function renderPresencas() {
    const y=state.year, m=state.month, days=daysInMonth(y,m);
    const filterCid = state.presencaClient==='all'?null:Number(state.presencaClient);
    const mots = filterCid?state.motoristas.filter(mo=>mo.client===filterCid):state.motoristas;

    document.getElementById('topbar-actions').innerHTML = `${monthNav()}
      <select onchange="window._presFilter(this.value)" style="padding:6px 10px;border:1px solid #dadce0;border-radius:8px;font-size:13px">
        <option value="all" ${state.presencaClient==='all'?'selected':''}>Todos</option>
        ${state.clients.map(c=>`<option value="${c.id}" ${state.presencaClient==c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" onclick="window._exportPresExcel()">⬇ Excel</button>`;

    if(!mots.length) { document.getElementById('content').innerHTML='<div class="card" style="padding:40px;text-align:center;color:#666">Nenhum motorista para este cliente.</div>'; return; }

    let html=`<div class="card">
      <div class="card-header">
        <span class="card-title">Presenças — ${MONTHS[m]} ${y}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px">
          <span class="leg-ok">✅ OK</span><span class="leg-falta">❌ Falta</span>
          <span class="leg-form">📘 Formação</span><span class="leg-back">🔄 Back Up</span>
          <span class="leg-bext">🟣 B.Externo</span><span class="leg-bint">🟠 B.Interno</span>
        </div>
      </div>
      <div class="presence-grid"><table class="presence-table">
        <thead><tr><th>Dia Sem.</th><th>Dia</th>
          ${mots.map(mo=>{ const c=state.clients.find(x=>x.id===mo.client); return `<th>${mo.name}${c&&!filterCid?`<br><small style="font-weight:400;opacity:.7">${c.name}</small>`:''}`;}).join('')}
        </tr></thead><tbody>`;

    for(let d=1;d<=days;d++){
      const dow=getDow(y,m,d), wk=dow===0||dow===6;
      html+=`<tr><td class="day-info${wk?' weekend':''}" style="font-size:11px">${DAYS_PT[dow]}</td>
        <td class="day-info${wk?' weekend':''}" style="font-weight:700">${d}</td>
        ${mots.map(mo=>{
          const val=getPresence(y,m,d,mo.id);
          return `<td class="${wk?'weekend':''} ${statusClass(val)}" id="pc-${d}-${mo.id}">
            <select class="status-select" onchange="window._updatePres(${y},${m},${d},${mo.id},this)">
              ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===val?'selected':''}>${s||'—'}</option>`).join('')}
            </select></td>`;
        }).join('')}
      </tr>`;
    }

    html+=`<tr style="background:#f0f4f8;font-weight:700"><td colspan="2" style="text-align:right;padding:8px 12px">Totais</td>
      ${mots.map(mo=>{
        let ok=0,falta=0,form=0,back=0,bext=0,bint=0;
        for(let d=1;d<=days;d++){
          const v=getPresence(y,m,d,mo.id);
          if(v==='OK')ok++; else if(v==='Falta')falta++; else if(v==='Formação')form++;
          else if(v==='Back Up')back++; else if(v==='Backup Externo')bext++; else if(v==='Backup Interno')bint++;
        }
        return `<td style="font-size:11px;text-align:center">${ok?`✅${ok} `:''}${falta?`❌${falta} `:''}${form?`📘${form} `:''}${back?`🔄${back} `:''}${bext?`🟣${bext} `:''}${bint?`🟠${bint}`:''}`;
      }).join('')}
    </tr></tbody></table></div></div>`;
    document.getElementById('content').innerHTML = html;
  }

  window._presFilter = v => { state.presencaClient=v; renderPresencas(); };
  window._updatePres = (y,m,d,mid,sel) => {
    setPresence(y,m,d,mid,sel.value);
    const cell=document.getElementById(`pc-${d}-${mid}`);
    if(cell) cell.className=cell.className.replace(/status-\S+/g,'').trim()+' '+statusClass(sel.value);
  };

  // =====================================================
  // ENTREGAS
  // =====================================================
  function renderEntregas() {
    const y=state.year, m=state.month;
    if(!state.selectedClient||!state.clients.find(c=>c.id===state.selectedClient)) state.selectedClient=state.clients[0]?.id||null;
    const client=state.clients.find(c=>c.id===state.selectedClient);

    document.getElementById('topbar-actions').innerHTML = `${monthNav()}
      <button class="btn btn-outline btn-sm" onclick="window._exportEntExcel()">⬇ Excel</button>`;

    let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
      <span style="font-size:12px;font-weight:600;color:#5f6368">Cliente:</span>
      ${state.clients.map(c=>`<div class="pill ${c.id===state.selectedClient?'active':''}" onclick="window._selClient(${c.id})">${c.name}</div>`).join('')}
    </div>`;

    if(!client){ document.getElementById('content').innerHTML=html+'<div class="card" style="padding:40px;text-align:center">Nenhum cliente.</div>'; return; }

    const days=daysInMonth(y,m), fields=client.fields, totals={};
    fields.forEach(f=>totals[f]=0);

    html+=`<div class="card">
      <div class="card-header">
        <span class="card-title">${client.name} — ${MONTHS[m]} ${y}</span>
        <span style="font-size:12px;color:#5f6368">${state.motoristas.filter(mo=>mo.client===client.id).map(m=>m.name).join(', ')}</span>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Dia Sem.</th><th>Dia</th>${fields.map(f=>`<th>${f}</th>`).join('')}<th>Total Dia</th><th>EDR%</th></tr></thead>
        <tbody>`;

    for(let d=1;d<=days;d++){
      const dow=getDow(y,m,d), wk=dow===0||dow===6, bg=wk?'background:#fffde7':'';
      const vals={}; fields.forEach(f=>{vals[f]=getEntrega(client.id,y,m,d,f);totals[f]+=vals[f];});
      const rowTotal=fields.reduce((s,f)=>s+vals[f],0);
      const edrVal=rowTotal>0?Math.round((vals[fields[0]]/rowTotal)*100):null;
      html+=`<tr style="${bg}">
        <td style="font-size:11px">${DAYS_PT[dow]}</td>
        <td style="font-weight:700">${d}</td>
        ${fields.map(f=>`<td><input class="delivery-input" type="number" min="0" value="${vals[f]||''}" placeholder="0"
          onchange="window._updateEnt(${client.id},${y},${m},${d},'${encodeF(f)}','${f}',this.value,${d})" /></td>`).join('')}
        <td style="font-weight:600" id="total-${d}">${rowTotal||''}</td>
        <td class="edr-cell ${edrClass(edrVal)}" id="edr-${d}">${edrVal!==null?edrVal+'%':'—'}</td>
      </tr>`;
    }

    const grandTotal=fields.reduce((s,f)=>s+totals[f],0);
    const edrTotal=grandTotal>0?Math.round((totals[fields[0]]/grandTotal)*100):null;
    html+=`<tr style="background:#f0f4f8;font-weight:700">
      <td colspan="2">Total</td>
      ${fields.map(f=>`<td id="ctotal-${encodeF(f)}">${totals[f].toLocaleString()}</td>`).join('')}
      <td id="grand-total">${grandTotal.toLocaleString()}</td>
      <td class="edr-cell ${edrClass(edrTotal)}" id="edr-total">${edrTotal!==null?edrTotal+'%':'—'}</td>
    </tr></tbody></table></div></div>`;
    document.getElementById('content').innerHTML=html;
  }

  window._selClient = id => { state.selectedClient=id; renderEntregas(); };
  window._updateEnt = (cid,y,m,d,fKey,fLabel,val,day) => {
    setEntrega(cid,y,m,d,fLabel,val);
    const client=state.clients.find(c=>c.id===cid); if(!client) return;
    const rowTotal=client.fields.reduce((s,f)=>s+getEntrega(cid,y,m,d,f),0);
    const edrVal=rowTotal>0?Math.round((getEntrega(cid,y,m,d,client.fields[0])/rowTotal)*100):null;
    const tc=document.getElementById(`total-${day}`); if(tc) tc.textContent=rowTotal||'';
    const ec=document.getElementById(`edr-${day}`); if(ec){ec.textContent=edrVal!==null?edrVal+'%':'—';ec.className=`edr-cell ${edrClass(edrVal)}`;}
    let grandTotal=0;
    client.fields.forEach(f=>{
      let s=0; for(let dd=1;dd<=daysInMonth(y,m);dd++) s+=getEntrega(cid,y,m,dd,f);
      const el=document.getElementById(`ctotal-${encodeF(f)}`); if(el) el.textContent=s.toLocaleString();
      grandTotal+=s;
    });
    const gt=document.getElementById('grand-total'); if(gt) gt.textContent=grandTotal.toLocaleString();
    const etot=grandTotal>0?Math.round((colTotal(cid,y,m,client.fields[0])/grandTotal)*100):null;
    const et=document.getElementById('edr-total'); if(et){et.textContent=etot!==null?etot+'%':'—';et.className=`edr-cell ${edrClass(etot)}`;}
  };
  function colTotal(cid,y,m,field){ let s=0; for(let d=1;d<=daysInMonth(y,m);d++) s+=getEntrega(cid,y,m,d,field); return s; }

  // =====================================================
  // CLIENTES
  // =====================================================
  function renderClientes() {
    document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="window._openClientModal()">+ Novo Cliente</button>`;
    document.getElementById('content').innerHTML=`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Cliente</th><th>Localização</th><th>Campos</th><th>Motoristas</th><th>Ações</th></tr></thead>
      <tbody>${state.clients.map(c=>{
        const mots=state.motoristas.filter(mo=>mo.client===c.id).map(mo=>mo.name).join(', ');
        return `<tr><td><strong>${c.name}</strong></td><td>${c.location}</td><td><small>${c.fields.join(', ')}</small></td><td>${mots||'—'}</td>
          <td><button class="btn btn-outline btn-sm" onclick="window._openClientModal(${c.id})">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="window._delClient(${c.id})">🗑️</button></td></tr>`;
      }).join('')}</tbody>
    </table></div></div>`;
  }

  window._openClientModal = function(id) {
    const c=id?state.clients.find(x=>x.id===id):null;
    document.getElementById('modal-title').textContent=c?'Editar Cliente':'Novo Cliente';
    document.getElementById('modal-body').innerHTML=`
      <div class="form-grid">
        <div class="form-group"><label>Nome</label><input id="c-name" value="${c?.name||''}" /></div>
        <div class="form-group"><label>Localização</label><input id="c-loc" value="${c?.location||''}" /></div>
      </div>
      <div class="form-group" style="margin-top:16px"><label>Campos do quadro</label>
        <div class="fields-check">${ALL_FIELDS.map(f=>`<label><input type="checkbox" value="${f}" ${c?.fields.includes(f)?'checked':''}> ${f}</label>`).join('')}</div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <input id="custom-field" placeholder="Campo personalizado..." style="padding:6px 10px;border:1px solid #dadce0;border-radius:6px;font-size:12px;flex:1">
          <button class="btn btn-outline btn-sm" onclick="window._addCustomField()">+ Adicionar</button>
        </div>
        <div id="extra-fields"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="window._closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="window._saveClient(${id||'null'})">Salvar</button>
      </div>`;
    document.getElementById('modal-overlay').classList.remove('hidden');
  };
  window._addCustomField = () => {
    const v=document.getElementById('custom-field').value.trim(); if(!v) return;
    document.getElementById('extra-fields').innerHTML+=`<label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px"><input type="checkbox" value="${v}" checked> ${v}</label>`;
    document.getElementById('custom-field').value='';
  };
  window._saveClient = async id => {
    const name=document.getElementById('c-name').value.trim();
    const location=document.getElementById('c-loc').value.trim();
    const fields=[...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(i=>i.value);
    if(!name) return alert('Nome obrigatório');
    if(!fields.length) return alert('Selecione pelo menos um campo');
    if(id){const c=state.clients.find(x=>x.id===id);c.name=name;c.location=location;c.fields=fields;}
    else state.clients.push({id:nextId(state.clients),name,location,fields});
    await saveConfig(); window._closeModal(); renderClientes();
  };
  window._delClient = async id => {
    if(!confirm('Tem certeza?')) return;
    state.clients=state.clients.filter(c=>c.id!==id); await saveConfig(); renderClientes();
  };

  // =====================================================
  // MOTORISTAS
  // =====================================================
  function renderMotoristas() {
    document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="window._openMotoModal()">+ Novo Motorista</button>`;
    document.getElementById('content').innerHTML=`<div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Nome</th><th>Cliente</th><th>Contacto</th><th>Ações</th></tr></thead>
      <tbody>${state.motoristas.map(mo=>{
        const c=state.clients.find(x=>x.id===mo.client);
        return `<tr><td><strong>${mo.name}</strong></td><td>${c?.name||'—'}</td><td>${mo.contact||'—'}</td>
          <td><button class="btn btn-outline btn-sm" onclick="window._openMotoModal(${mo.id})">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="window._delMoto(${mo.id})">🗑️</button></td></tr>`;
      }).join('')}</tbody>
    </table></div></div>`;
  }

  window._openMotoModal = function(id) {
    const mo=id?state.motoristas.find(x=>x.id===id):null;
    document.getElementById('modal-title').textContent=mo?'Editar Motorista':'Novo Motorista';
    document.getElementById('modal-body').innerHTML=`
      <div class="form-grid">
        <div class="form-group"><label>Nome</label><input id="m-name" value="${mo?.name||''}" /></div>
        <div class="form-group"><label>Contacto</label><input id="m-contact" value="${mo?.contact||''}" /></div>
        <div class="form-group"><label>Cliente</label>
          <select id="m-client">
            <option value="">— Sem cliente —</option>
            ${state.clients.map(c=>`<option value="${c.id}" ${mo?.client===c.id?'selected':''}>${c.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="window._closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="window._saveMoto(${id||'null'})">Salvar</button>
      </div>`;
    document.getElementById('modal-overlay').classList.remove('hidden');
  };
  window._saveMoto = async id => {
    const name=document.getElementById('m-name').value.trim();
    const contact=document.getElementById('m-contact').value.trim();
    const client=Number(document.getElementById('m-client').value)||null;
    if(!name) return alert('Nome obrigatório');
    if(id){const mo=state.motoristas.find(x=>x.id===id);mo.name=name;mo.contact=contact;mo.client=client;}
    else state.motoristas.push({id:nextId(state.motoristas),name,contact,client});
    await saveConfig(); window._closeModal(); renderMotoristas();
  };
  window._delMoto = async id => {
    if(!confirm('Tem certeza?')) return;
    state.motoristas=state.motoristas.filter(x=>x.id!==id); await saveConfig(); renderMotoristas();
  };

  // =====================================================
  // RELATÓRIOS
  // =====================================================
  function renderRelatorios() {
    document.getElementById('topbar-actions').innerHTML='';
    document.getElementById('content').innerHTML=`<div class="card">
      <div class="card-header"><span class="card-title">Gerar Relatório</span></div>
      <div class="form-grid">
        <div class="form-group"><label>Tipo</label>
          <select id="rep-type">
            <option value="entregas">Entregas por Cliente</option>
            <option value="presencas">Presenças</option>
          </select>
        </div>
        <div class="form-group"><label>Cliente</label>
          <select id="rep-client">
            <option value="all">Todos</option>
            ${state.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>Mês</label>
          <select id="rep-month">${MONTHS.map((mo,i)=>`<option value="${i}" ${i===state.month?'selected':''}>${mo}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Ano</label>
          <input id="rep-year" type="number" value="${state.year}" min="2020" max="2099" />
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button class="btn btn-success" onclick="window._exportExcel()">⬇ Exportar Excel</button>
        <button class="btn btn-primary" onclick="window._exportPDF()">🖨️ Imprimir / PDF</button>
      </div>
    </div>`;
  }

  // =====================================================
  // EXPORTS
  // =====================================================
  window._exportPresExcel = () => {
    const wb=XLSX.utils.book_new(), y=state.year, m=state.month, days=daysInMonth(y,m);
    const mots=state.presencaClient==='all'?state.motoristas:state.motoristas.filter(mo=>mo.client===Number(state.presencaClient));
    const rows=[['Dia Semana','Dia',...mots.map(mo=>mo.name)]];
    for(let d=1;d<=days;d++) rows.push([DAYS_PT[getDow(y,m,d)],d,...mots.map(mo=>getPresence(y,m,d,mo.id)||'')]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Presenças');
    XLSX.writeFile(wb,`presencas_${MONTHS[m]}_${y}.xlsx`);
  };
  window._exportEntExcel = () => {
    const client=state.clients.find(c=>c.id===state.selectedClient); if(!client) return;
    const wb=XLSX.utils.book_new(), y=state.year, m=state.month, days=daysInMonth(y,m);
    const tots={}; client.fields.forEach(f=>tots[f]=0);
    const rows=[['Dia Semana','Dia',...client.fields,'Total Dia','EDR%']];
    for(let d=1;d<=days;d++){
      const vals=client.fields.map(f=>{const v=getEntrega(client.id,y,m,d,f);tots[f]+=v;return v;});
      const rt=vals.reduce((a,b)=>a+b,0);
      rows.push([DAYS_PT[getDow(y,m,d)],d,...vals,rt,rt>0?Math.round((vals[0]/rt)*100)+'%':'']);
    }
    const gt=client.fields.reduce((s,f)=>s+tots[f],0);
    rows.push(['TOTAL','',...client.fields.map(f=>tots[f]),gt,gt>0?Math.round((tots[client.fields[0]]/gt)*100)+'%':'']);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),client.name);
    XLSX.writeFile(wb,`${client.name}_${MONTHS[m]}_${y}.xlsx`);
  };
  window._exportExcel = () => {
    const type=document.getElementById('rep-type').value;
    const clientId=document.getElementById('rep-client').value;
    const month=Number(document.getElementById('rep-month').value);
    const year=Number(document.getElementById('rep-year').value);
    const days=daysInMonth(year,month);
    const wb=XLSX.utils.book_new();
    if(type==='presencas'){
      const mots=clientId==='all'?state.motoristas:state.motoristas.filter(m=>m.client===Number(clientId));
      const rows=[['Dia Semana','Dia',...mots.map(m=>m.name)]];
      for(let d=1;d<=days;d++) rows.push([DAYS_PT[getDow(year,month,d)],d,...mots.map(mo=>getPresence(year,month,d,mo.id)||'')]);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Presenças');
    } else {
      const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
      clients.forEach(c=>{
        const tots={}; c.fields.forEach(f=>tots[f]=0);
        const rows=[['Dia Semana','Dia',...c.fields,'Total Dia','EDR%']];
        for(let d=1;d<=days;d++){
          const vals=c.fields.map(f=>{const v=getEntrega(c.id,year,month,d,f);tots[f]+=v;return v;});
          const rt=vals.reduce((a,b)=>a+b,0);
          rows.push([DAYS_PT[getDow(year,month,d)],d,...vals,rt,rt>0?Math.round((vals[0]/rt)*100)+'%':'']);
        }
        const gt=c.fields.reduce((s,f)=>s+tots[f],0);
        rows.push(['TOTAL','',...c.fields.map(f=>tots[f]),gt,gt>0?Math.round((tots[c.fields[0]]/gt)*100)+'%':'']);
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.name.substring(0,31));
      });
    }
    XLSX.writeFile(wb,`relatorio_${MONTHS[month]}_${year}.xlsx`);
  };
  window._exportPDF = () => {
    const type=document.getElementById('rep-type').value;
    const month=Number(document.getElementById('rep-month').value);
    const year=Number(document.getElementById('rep-year').value);
    const clientId=document.getElementById('rep-client').value;
    const clients=clientId==='all'?state.clients:state.clients.filter(c=>c.id===Number(clientId));
    const days=daysInMonth(year,month);
    let html=`<html><head><style>body{font-family:Arial;font-size:11px;padding:20px}h2{color:#1a73e8;margin-bottom:12px}h3{margin:16px 0 8px}table{width:100%;border-collapse:collapse;margin-bottom:20px}th{background:#1e2a3a;color:#fff;padding:6px 8px}td{padding:5px 8px;border-bottom:1px solid #eee}tr:nth-child(even)td{background:#f9f9f9}.eh{color:#137333;font-weight:700}.el{color:#c5221f;font-weight:700}.tr td{background:#e8f0fe!important;font-weight:700}</style></head><body><h2>TrafficLogistics DE — ${MONTHS[month]} ${year}</h2>`;
    if(type==='presencas'){
      const mots=clientId==='all'?state.motoristas:state.motoristas.filter(m=>m.client===Number(clientId));
      html+=`<table><thead><tr><th>Dia</th><th>Semana</th>${mots.map(m=>`<th>${m.name}</th>`).join('')}</tr></thead><tbody>`;
      for(let d=1;d<=days;d++) html+=`<tr><td>${d}</td><td>${DAYS_PT[getDow(year,month,d)]}</td>${mots.map(mo=>`<td>${getPresence(year,month,d,mo.id)||'—'}</td>`).join('')}</tr>`;
      html+=`</tbody></table>`;
    } else {
      clients.forEach(c=>{
        const tots={}; c.fields.forEach(f=>tots[f]=0);
        html+=`<h3>${c.name} — ${c.location}</h3><table><thead><tr><th>Dia</th>${c.fields.map(f=>`<th>${f}</th>`).join('')}<th>Total</th><th>EDR%</th></tr></thead><tbody>`;
        for(let d=1;d<=days;d++){
          const vals=c.fields.map(f=>{const v=getEntrega(c.id,year,month,d,f);tots[f]+=v;return v;});
          const rt=vals.reduce((a,b)=>a+b,0); if(rt===0) continue;
          const edr=Math.round((vals[0]/rt)*100);
          html+=`<tr><td>${d}</td>${vals.map(v=>`<td>${v||''}</td>`).join('')}<td>${rt}</td><td class="${edr>=95?'eh':edr<80?'el':''}">${edr}%</td></tr>`;
        }
        const gt=c.fields.reduce((s,f)=>s+tots[f],0), edrT=gt>0?Math.round((tots[c.fields[0]]/gt)*100):null;
        html+=`<tr class="tr"><td>TOTAL</td>${c.fields.map(f=>`<td>${tots[f]}</td>`).join('')}<td>${gt}</td><td>${edrT!==null?edrT+'%':'—'}</td></tr></tbody></table>`;
      });
    }
    html+=`</body></html>`;
    const w=window.open('','_blank'); w.document.write(html); w.document.close(); w.print();
  };

  // =====================================================
  // MODAL
  // =====================================================
  window._closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

  // =====================================================
  // AUTH
  // =====================================================
  function showLogin() {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }
  function showApp() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadAllData();
  }

  window._doLogin = async () => {
    const email=document.getElementById('login-email').value.trim();
    const pass=document.getElementById('login-pass').value;
    const err=document.getElementById('login-err');
    err.textContent='';
    try {
      await signInWithEmailAndPassword(auth,email,pass);
    } catch(e) {
      err.textContent='Email ou password incorretos.';
    }
  };
  window._doLogout = async () => { await signOut(auth); };

  onAuthStateChanged(auth, user => {
    if(user) {
      document.getElementById('user-email').textContent=user.email;
      showApp();
    } else {
      showLogin();
    }
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{--primary:#1a73e8;--primary-dark:#1557b0;--success:#34a853;--danger:#ea4335;--bg:#f0f4f8;--card:#fff;--text:#202124;--text-light:#5f6368;--border:#dadce0;}

  /* APP LAYOUT */
  #app{display:flex;height:100vh;overflow:hidden;}

  #sidebar .logo{padding:20px 16px;font-size:15px;font-weight:700;border-bottom:1px solid #2d3f54;display:flex;align-items:center;gap:8px;}
  #sidebar .logo span{font-size:22px;}
  .nav-section{padding:12px 16px 4px;font-size:10px;text-transform:uppercase;color:#7a8fa6;letter-spacing:1px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:#b0bec5;transition:all .2s;}
  .nav-item:hover,.nav-item.active{background:#2d3f54;color:#fff;}

  #main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

  #topbar h1{font-size:18px;font-weight:600;}
  #topbar .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #content{flex:1;overflow-y:auto;padding:24px;}

  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;margin-bottom:20px;}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .card-title{font-size:15px;font-weight:600;}

  .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .2s;}
  .btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-dark);}
  .btn-success{background:var(--success);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);} .btn-outline:hover{background:var(--bg);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .stat-card .label{font-size:12px;color:var(--text-light);margin-bottom:6px;}
  .stat-card .value{font-size:26px;font-weight:700;}
  .stat-card.blue .value{color:var(--primary);} .stat-card.green .value{color:var(--success);}
  .stat-card.red .value{color:var(--danger);} .stat-card.orange .value{color:#f57c00;}

  .tbl-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:#f8f9fa;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:8px 12px;border-bottom:1px solid #f0f0f0;}
  tr:hover td{background:#f8f9fa;}

  .presence-grid{overflow-x:auto;}
  .presence-table{border-collapse:collapse;min-width:100%;}
  .presence-table th,.presence-table td{border:1px solid var(--border);padding:4px 6px;text-align:center;font-size:11px;white-space:nowrap;}
  .presence-table th{background:#1e2a3a;color:#fff;}
  .presence-table td.day-info{background:#f8f9fa;font-weight:600;}
  .presence-table td.weekend{background:#fffde7;}
  select.status-select{border:none;background:transparent;font-size:11px;width:105px;cursor:pointer;font-weight:600;}
  .status-ok{background:#e6f4ea!important;color:#137333;}
  .status-falta{background:#fce8e6!important;color:#c5221f;}
  .status-formacao{background:#e8f0fe!important;color:#1a73e8;}
  .status-backup{background:#fef7e0!important;color:#b45309;}

  .leg-ok{background:#e6f4ea;color:#137333;padding:3px 8px;border-radius:10px;}

  .leg-form{background:#e8f0fe;color:#1a73e8;padding:3px 8px;border-radius:10px;}
  .leg-back{background:#fef7e0;color:#b45309;padding:3px 8px;border-radius:10px;}
  .leg-bext{background:#f3e8ff;color:#7b2d8b;padding:3px 8px;border-radius:10px;}
  .leg-bint{background:#fff3e0;color:#e65100;padding:3px 8px;border-radius:10px;}

  .delivery-input{width:60px;border:1px solid transparent;background:transparent;text-align:center;padding:2px;font-size:12px;border-radius:4px;}
  .delivery-input:focus{border-color:var(--primary);outline:none;background:#fff;}
  .edr-cell{font-weight:700;}
  .edr-high{color:#137333;} .edr-mid{color:#f57c00;} .edr-low{color:#c5221f;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group label{font-size:12px;font-weight:600;color:var(--text-light);}
  .form-group input,.form-group select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;}
  .form-group input:focus,.form-group select:focus{border-color:var(--primary);outline:none;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;}
  .modal{background:#fff;border-radius:16px;padding:28px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-title{font-size:16px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-light);}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;}

  .pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;transition:all .2s;}
  .pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-nav button{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px;}
  .month-nav span{font-weight:600;font-size:14px;min-width:130px;text-align:center;}

  .fields-check{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
  .fields-check label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;}

  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">🚚</div>
    <h2>TrafficLogistics DE</h2>
    <p>Inicia sessão para continuar</p>
    <input type="email" id="login-email" placeholder="Email" />
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')window._doLogin()" />
    <button onclick="window._doLogin()">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav id="sidebar">
    <div class="logo"><span>🚚</span> TrafficLogistics DE</div>
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="window._showPage('dashboard')"><span class="icon">📊</span> Dashboard</div>
    <div class="nav-item" onclick="window._showPage('presencas')"><span class="icon">✅</span> Presenças</div>
    <div class="nav-section">Lançamentos</div>
    <div class="nav-item" onclick="window._showPage('entregas')"><span class="icon">📦</span> Entregas Diárias</div>
    <div class="nav-section">Cadastros</div>
    <div class="nav-item" onclick="window._showPage('clientes')"><span class="icon">🏢</span> Clientes</div>
    <div class="nav-item" onclick="window._showPage('motoristas')"><span class="icon">👤</span> Motoristas</div>
    <div class="nav-section">Relatórios</div>
    <div class="nav-item" onclick="window._showPage('relatorios')"><span class="icon">📄</span> Relatórios</div>
    <div class="sidebar-bottom">
      <small id="user-email"></small>
      <button onclick="window._doLogout()">🚪 Sair</button>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="actions" id="topbar-actions"></div>
    </div>
    <div id="content">
      <div style="padding:40px;text-align:center;color:#666">A carregar...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="window._closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

</body>
</html>
